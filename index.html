<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Myxo Petri Wars</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen lab bench. A lit petri "lightbox" stage plus a specimen panel (left on desktop, below on phones); battle mode gives the stage the whole bench. Single dark look by choice: a lab bench at night. */
:root {
  --bench: #0d1214;
  --bench-2: #121a1d;
  --panel: #151d20;
  --raised: #1c262a;
  --raised-2: #243035;
  --line: #2a363b;
  --ink: #ece5d3;
  --dim: #98a39e;
  --faint: #66736f;
  --gold: #f4c53c;
  --gold-deep: #c8961a;
  --gold-ink: #241a02;
  --rival: #e2508a;
  --rival-deep: #a72b5e;
  --agar: #b9a77e;
  --ok: #9ad17f;
  --bad: #f06a5f;
  --f-display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bench); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 12px; box-sizing: border-box; }
.bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.logo { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: -0.03em; color: var(--gold); line-height: 1; }
.logo span { color: var(--rival); }
.tagline { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
.progress { font-family: var(--f-mono); font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.progress .dots { display: flex; gap: 4px; }
.progress .dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
.progress .dots i.on { background: var(--gold); border-color: var(--gold); }

.main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.stage { position: relative; flex: none; height: 40%; min-height: 220px; border-radius: var(--r-lg); overflow: hidden; background: radial-gradient(120% 90% at 50% 38%, #24302f 0%, #141c1e 48%, #0b1012 100%); box-shadow: inset 0 0 0 1px var(--line); touch-action: none; }
.stage canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.panel { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; border-radius: var(--r-lg); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
#app.mode-battle .stage { flex: 1; height: auto; }
#app.mode-battle .panel { display: none; }
@media (min-width: 880px) {
  .main { flex-direction: row-reverse; }
  .stage { flex: 1; height: auto; }
  .panel { flex: none; width: 420px; }
}

/* ---------- Rack ---------- */
.pad { padding: 18px 18px 22px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.rack h1 { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -0.02em; margin-top: 6px; }
.rack .lede { color: var(--dim); margin: 8px 0 16px; max-width: 62ch; }
.dishes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.dish { width: 100%; display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 10px 12px 10px 10px; border-radius: var(--r-md); background: var(--raised); border: 1px solid var(--line); cursor: pointer; min-height: 72px; }
.dish:hover:not(:disabled) { background: var(--raised-2); }
.dish:disabled { cursor: not-allowed; opacity: 0.5; }
.dish.sel { border-color: var(--gold); }
.dish canvas { width: 56px; height: 56px; border-radius: 50%; display: block; }
.dish .meta { min-width: 0; display: grid; gap: 2px; }
.dish .code { font-family: var(--f-mono); font-size: 11px; color: var(--faint); letter-spacing: 0.08em; }
.dish b { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.15; }
.dish .rv { color: var(--dim); font-size: 12.5px; font-style: italic; }
.chip { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.chip.won { color: var(--gold-ink); background: var(--gold); border-color: var(--gold); }
.chip.ready { color: var(--gold); border-color: var(--gold-deep); }
.howto { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.howto summary { cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 16px; list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
.howto summary::after { content: "+"; font-family: var(--f-mono); color: var(--faint); }
.howto[open] summary::after { content: "–"; }
.howto ol { margin: 10px 0 0; padding-left: 20px; color: var(--dim); display: grid; gap: 6px; max-width: 62ch; }
.howto b { color: var(--ink); font-weight: 600; }
.linkbtn { background: none; border: 0; padding: 8px 0; color: var(--faint); font-family: var(--f-mono); font-size: 11.5px; text-decoration: underline; cursor: pointer; margin-top: 14px; }

/* ---------- Lab ---------- */
.lab { display: flex; flex-direction: column; min-height: 100%; }
.lab-body { padding: 14px 18px 8px; display: grid; gap: 18px; }
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 0; color: var(--dim); cursor: pointer; font-size: 13px; min-height: 36px; }
.lab-title { display: grid; gap: 4px; }
.lab-title h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1.05; letter-spacing: -0.02em; }
.lab-title p { margin: 2px 0 0; color: var(--dim); max-width: 62ch; }
.intel { display: grid; gap: 10px; padding: 12px; border-radius: var(--r-md); background: var(--bench-2); border: 1px solid var(--line); }
.intel .row { display: grid; gap: 6px; }
.intel .lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 9px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); }
.tag .sw { width: 9px; height: 9px; border-radius: 3px; }
.tag.yes { border-color: #4a6b3c; }
.tag.no { border-color: #6b3b38; }
.tag .mk { font-family: var(--f-mono); font-size: 11px; }
.tag.yes .mk { color: var(--ok); } .tag.no .mk { color: var(--bad); }
.rival-name { font-family: var(--f-display); font-weight: 700; font-size: 16px; color: var(--rival); font-style: italic; }
.rival-stats { font-family: var(--f-mono); font-size: 11.5px; color: var(--dim); }
.sec { display: grid; gap: 10px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-h h3 { font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.sec-h small { color: var(--faint); font-size: 12px; }
.name-in { width: 100%; box-sizing: border-box; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-sm); color: var(--ink); padding: 10px 12px; font-family: var(--f-display); font-weight: 700; font-size: 17px; min-height: 44px; }
/* Strain: the name row saves the current strain; the rack below lists saved strains to load, rename or delete. */
.strain-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.sec-h small.st-dirty { color: var(--gold); } .sec-h small.st-saved { color: var(--ok); }
.lib { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bench-2); }
.lib summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; font-weight: 600; }
.lib summary::-webkit-details-marker { display: none; }
.lib summary .n { font-family: var(--f-mono); font-size: 12px; font-weight: 400; color: var(--faint); margin-right: auto; }
.lib summary::after { content: "+"; font-family: var(--f-mono); color: var(--faint); }
.lib[open] summary::after { content: "–"; }
.lib-empty { margin: 0; padding: 0 12px 12px; color: var(--dim); font-size: 12.5px; }
.strains { list-style: none; margin: 0; padding: 0 8px 8px; display: grid; gap: 6px; }
.strain { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 8px 8px 8px 12px; border-radius: var(--r-sm); background: var(--raised); border: 1px solid var(--line); }
.strain.cur { border-color: var(--gold-deep); }
.strain .pick { min-width: 0; display: grid; gap: 2px; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.strain .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; }
.strain .top b { max-width: 100%; font-family: var(--f-display); font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strain .pick:hover .top b { color: var(--gold); }
.strain .kb { font-family: var(--f-mono); font-size: 11px; color: var(--dim); white-space: nowrap; }
.strain .kb.over { color: var(--bad); }
.strain .sum { font-family: var(--f-mono); font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strain .ib { width: 36px; height: 36px; border-radius: 9px; font-size: 14px; color: var(--dim); }
.strain .ib svg { width: 16px; height: 16px; }
.strain .ib.armed { width: auto; padding: 0 10px; font-family: var(--f-mono); font-size: 12px; color: var(--bad); border-color: var(--bad); }
.strain .ren { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.strain .ren .name-in { flex: 1 1 140px; width: auto; font-size: 15px; min-height: 40px; padding: 6px 10px; }
.strain .ren .name-in[aria-invalid="true"] { border-color: var(--bad); }
.strain .ren .btn { min-height: 40px; padding: 0 14px; }
.strain .ren .err { flex-basis: 100%; color: var(--bad); font-size: 12.5px; }
.trait { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border-radius: var(--r-md); background: var(--raised); border: 1px solid var(--line); }
.trait .tn { font-weight: 600; }
.trait .td { grid-column: 1 / -1; color: var(--dim); font-size: 12.5px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; background: var(--raised-2); border: 1px solid var(--line); cursor: pointer; font-size: 18px; line-height: 1; }
.stepper button:disabled { opacity: 0.35; cursor: not-allowed; }
.pips { display: flex; gap: 3px; padding: 0 6px; }
.pips i { width: 8px; height: 18px; border-radius: 3px; background: var(--raised-2); }
.pips i.on { background: var(--gold); }
.cost { font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.derived { font-family: var(--f-mono); font-size: 11.5px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; }
.derived b { color: var(--ink); font-weight: 500; }
.slider { display: grid; grid-template-columns: 92px 1fr 26px; align-items: center; gap: 10px; min-height: 40px; }
.slider label { font-size: 13px; }
.slider output { font-family: var(--f-mono); font-size: 12px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--raised-2); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--raised-2); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); margin-top: -8px; border: 3px solid var(--panel); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--gold); border: 3px solid var(--panel); }
.genes { display: grid; gap: 6px; }
.gene { display: grid; grid-template-columns: 30px 1fr auto; gap: 2px 10px; align-items: center; text-align: left; width: 100%; padding: 10px 12px 10px 10px; border-radius: var(--r-md); background: var(--raised); border: 1px solid var(--line); cursor: pointer; min-height: 56px; }
.gene .glyph { grid-row: 1 / 3; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.gene .glyph svg { width: 16px; height: 16px; }
.gene .gn { font-weight: 600; }
.gene .gc { font-family: var(--f-mono); font-size: 11px; color: var(--dim); }
.gene .gd { grid-column: 2 / 4; color: var(--dim); font-size: 12.5px; }
.gene[aria-pressed="true"] { background: #2b2a17; border-color: var(--gold-deep); }
.gene[aria-pressed="true"] .glyph { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.gene[aria-pressed="true"] .gc { color: var(--gold); }
.gene.locked { cursor: not-allowed; opacity: 0.45; }
.gene.locked .gd { font-style: italic; }
.gene.cant:not([aria-pressed="true"]) { opacity: 0.7; }
.lab-foot { position: sticky; bottom: 0; margin-top: auto; background: linear-gradient(to top, var(--panel) 75%, transparent); padding: 18px 18px 14px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.budget { display: grid; gap: 6px; }
.budget .bl { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.budget .bl b { color: var(--ink); font-weight: 500; }
.budget.over .bl b { color: var(--bad); }
.meter { height: 8px; border-radius: 4px; background: var(--raised-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--gold); border-radius: 4px; transition: width .2s; }
.budget.over .meter i { background: var(--bad); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: var(--r-md); background: var(--raised-2); border: 1px solid var(--line); cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-family: var(--f-display); font-weight: 800; font-size: 16px; letter-spacing: 0.01em; }
.btn.primary:disabled { background: var(--raised-2); border-color: var(--line); color: var(--faint); cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }

/* ---------- Battle HUD ---------- */
.hud { position: absolute; left: 0; right: 0; top: 0; padding: 10px 12px 26px; background: linear-gradient(to bottom, rgba(8,12,13,.85), rgba(8,12,13,0)); pointer-events: none; display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px 10px; align-items: start; }
.hud .side { min-width: 0; display: grid; gap: 1px; }
.hud .side.e { text-align: right; }
.hud .sname { font-family: var(--f-display); font-weight: 700; font-size: 15px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud .side.p .sname { color: var(--gold); } .hud .side.e .sname { color: var(--rival); font-style: italic; }
.hud .nums { font-family: var(--f-mono); font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hud .nums b { color: var(--ink); font-weight: 500; }
.hud .clock { text-align: center; display: grid; }
.hud .clock span { font-family: var(--f-mono); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.hud .clock small { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
.tug { grid-column: 1 / -1; height: 6px; border-radius: 3px; overflow: hidden; display: flex; background: var(--raised-2); }
.tug i { display: block; height: 100%; transition: width .15s linear; }
.tug .tp { background: var(--gold); } .tug .te { background: var(--rival); margin-left: auto; }
.toast { position: absolute; left: 50%; top: 78px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 7px 12px; border-radius: 999px; background: rgba(13,18,20,.88); border: 1px solid var(--line); font-size: 13px; display: flex; gap: 8px; align-items: center; pointer-events: none; transition: opacity .3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast .tt { font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.toast .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font-family: var(--f-mono); font-size: 11px; color: var(--faint); pointer-events: none; transition: opacity .6s; white-space: nowrap; }
.corner { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.corner .ib { pointer-events: auto; }
.keys { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 10px; padding: 7px 11px; border-radius: 999px; background: rgba(13,18,20,.82); border: 1px solid var(--line); font-family: var(--f-mono); font-size: 10.5px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; max-width: 360px; }
.keys span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.keys i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.keys i.two { background: linear-gradient(90deg, var(--gold) 50%, var(--rival) 50%); border-radius: 2px; }
.vbtn { width: 38px; height: 38px; border-radius: 10px; font-size: 17px; }
.vbtn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
@media (max-width: 600px) { .keys { display: none; } }
.inspect { position: absolute; left: 12px; bottom: 12px; width: min(270px, calc(100% - 24px)); padding: 12px 14px; border-radius: var(--r-md); background: rgba(16,22,24,.94); border: 1px solid var(--line); display: grid; gap: 6px; font-size: 13px; }
.inspect header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.inspect header b { font-family: var(--f-display); font-size: 15px; }
.inspect .x { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; }
.inspect dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
.inspect dt { color: var(--faint); font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; padding-top: 2px; }
.inspect dd { margin: 0; font-variant-numeric: tabular-nums; }
.hpbar { height: 5px; border-radius: 3px; background: var(--raised-2); overflow: hidden; margin-top: 3px; }
.hpbar i { display: block; height: 100%; }
.log { position: absolute; right: 12px; top: 86px; bottom: 12px; width: min(300px, calc(100% - 24px)); border-radius: var(--r-md); background: rgba(16,22,24,.95); border: 1px solid var(--line); display: flex; flex-direction: column; }
.log header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.log header b { font-family: var(--f-display); font-size: 15px; }
.log ol { list-style: none; margin: 0; padding: 4px; overflow-y: auto; flex: 1; }
.log li button { width: 100%; text-align: left; background: none; border: 0; padding: 8px; border-radius: 8px; display: grid; grid-template-columns: 44px 10px 1fr; gap: 8px; align-items: center; cursor: pointer; font-size: 12.5px; }
.log li button:hover, .log li button.cur { background: var(--raised); }
.log .tt { font-family: var(--f-mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.log .dot { width: 8px; height: 8px; border-radius: 50%; }

.result { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(6,9,10,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.card { width: min(440px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; display: grid; gap: 14px; }

<script>
// ===================== MYXO SIMULATION =====================
// Deterministic cellular battle between two plasmodia on a petri dish.
const N = 52, NN = N * N, MAXT = 720;
const CXf = (N - 1) / 2, DISH_R = N / 2 - 1.0;
const T_VOID = 0, T_AGAR = 1, T_ROCK = 2, T_SALT = 3, T_LIGHT = 4;
const F_NONE = 0, F_SUGAR = 1, F_PROT = 2, F_LIGN = 3;
const S_NONE = 0, S_ENGULF = 1, S_ACID = 2, S_TOXIN = 3, S_SALT = 4, S_UV = 5, S_STARVE = 6, S_SEVER = 7;
const SRC_NAMES = ['—', 'Engulfed', 'Acid', 'Antibiotic', 'Salt', 'UV glare', 'Starvation', 'Severed'];
const FOOD_NAMES = ['', 'Oat flakes', 'Bacterial lawn', 'Bark chips'];
const ROCK_HP = 14;
const EAT_RATE = [0, 0.5, 0.5, 0.22];
const YIELD = [0, 1.0, 1.25, 2.6];

const DX = [1, -1, 0, 0, 1, 1, -1, -1], DY = [0, 0, 1, -1, 1, -1, 1, -1];
const NB = new Int32Array(NN * 8).fill(-1);
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  const i = y * N + x;
  for (let k = 0; k < 8; k++) {
    const nx = x + DX[k], ny = y + DY[k];
    if (nx >= 0 && ny >= 0 && nx < N && ny < N) NB[i * 8 + k] = ny * N + nx;
  }
}

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------- Genes ----------------
const GENES = [
  { id: 'amylase', cat: 'Metabolism', name: 'Amylase', cost: 1, unlock: 0, desc: 'Digests oat flakes. The staple diet.' },
  { id: 'protease', cat: 'Metabolism', name: 'Protease', cost: 1, unlock: 0, desc: 'Digests bacterial lawns. Richer than oats.' },
  { id: 'ligninase', cat: 'Metabolism', name: 'Ligninase', cost: 2, unlock: 3, desc: 'Digests bark chips. Slow to break down, very rich.' },
  { id: 'chloro', cat: 'Metabolism', name: 'Algal Symbiont', cost: 3, unlock: 4, desc: 'Feeds on sunlit agar and shrugs off UV glare.' },
  { id: 'necro', cat: 'Metabolism', name: 'Necrotrophy', cost: 2, unlock: 6, desc: 'Absorbs slain rival cells for a burst of energy.' },
  { id: 'chitin', cat: 'Defense', name: 'Chitin Rind', cost: 2, unlock: 0, desc: 'Halves engulfing damage. Growth costs 15% more.' },
  { id: 'mucus', cat: 'Defense', name: 'Alkaline Slime', cost: 2, unlock: 2, desc: 'Neutralises 65% of acid and 40% of antibiotic damage.' },
  { id: 'osmo', cat: 'Defense', name: 'Osmotic Pumps', cost: 1, unlock: 3, desc: 'Immune to salt crust. Grows across it freely.' },
  { id: 'sclero', cat: 'Defense', name: 'Sclerotia', cost: 2, unlock: 4, desc: 'When starving, hardens and sleeps instead of dying. Sleeping cells take 60% less damage.' },
  { id: 'regen', cat: 'Defense', name: 'Cytoplasmic Healing', cost: 2, unlock: 0, desc: 'Connected cells heal quickly between fights.' },
  { id: 'crush', cat: 'Offense', name: 'Pseudopod Crush', cost: 2, unlock: 0, desc: '+60% engulfing damage on contact.' },
  { id: 'acid', cat: 'Offense', name: 'Oxalic Acid', cost: 3, unlock: 2, desc: 'Burns rivals on contact and dissolves granite. Costs energy per burn.' },
  { id: 'toxin', cat: 'Offense', name: 'Antibiotic Haze', cost: 3, unlock: 5, desc: 'Poisons rival cells up to 2 cells away. Costs energy.' },
  { id: 'spores', cat: 'Offense', name: 'Spore Cannons', cost: 3, unlock: 6, desc: 'Every 45 min fires spores at distant food. Sporelings become new nuclei.' },
  { id: 'prune', cat: 'Network', name: 'Vein Pruning', cost: 1, unlock: 0, desc: 'Retracts idle tubes into a lean network. Refunds energy, lowers upkeep.' },
  { id: 'granules', cat: 'Network', name: 'Reserve Granules', cost: 2, unlock: 5, desc: 'Banks energy in every cell. Fragments cut off from food carry 2.5× the reserve and can wait out a famine, but less goes into growth.' },
];
const GENE_BY_ID = Object.fromEntries(GENES.map(g => [g.id, g]));
const TRAIT_COST = [0, 0, 1, 2, 4, 6]; // index by level 1..5
const DRIVE_COST = [0, 0, 1, 2, 3, 5]; // index by level 0..5: a drive at 0 is free and switched off
const SENSE_RANGE = [0, 5, 9, 13, 18, 26]; // cells a strain can sense from any cell it owns, by Sensor range level 1..5
const PROBE_EVERY = 10, PROBE_TTL = 30, PROBE_REACH = 22; // exploration spikes: refill interval, lifetime, length (cells)
const DOM_SHARE = 0.9, DOM_TICKS = 30, DOM_MIN = 200; // overrun: hold 90% of living tissue for 30 min with a real body
const RETRACT_RATE = 0.02, RETRACT_UNTIL = 20; // a starving fragment withdraws up to 2% of its cells a minute until its pool is back above 20 ATP
const RETRACT_JITTER = 3; // cells of randomness in the withdrawal order, so a famine frays the edge instead of peeling a neat ring
const GROW_TENSION = 0.03; // growth score per own neighbour of a candidate cell: fronts stay cohesive instead of fraying into threads
// Walking distance: a straight step costs DW, a diagonal DD (7/5 ≈ √2). Distance fields are therefore near-Euclidean, in
// units of 1/DW cell, and their level sets are octagons rather than the squares a plain 8-neighbour BFS produces.
const DW = 5, DD = 7, DI = 1 / DW;
const cl01 = (v, a, b) => Math.max(a, Math.min(b, v));

// Genomes: { vigor 1-5, density 1-5, sense 1-5, genes [], taxis { food 0-5, hunt 0-5, explore 0-5 } }.
// Older saves carried free 0-10 food/hunt/wander ratios; they are folded into the new absolute drives here.
function normGenome(g) {
  const t = (g && g.taxis) || {};
  const old = 'wander' in t || t.food > 5 || t.hunt > 5;
  const lv = v => cl01(Math.floor((v || 0) / 2), 0, 5);
  const drive = (v, dflt) => cl01(Math.round(v == null ? dflt : v), 0, 5);
  return {
    vigor: cl01(Math.round(g.vigor || 2), 1, 5), density: cl01(Math.round(g.density || 2), 1, 5), sense: cl01(Math.round(g.sense || 2), 1, 5),
    genes: (g.genes || []).map(id => id === 'fragment' ? 'granules' : id),
    taxis: old ? { food: lv(t.food), hunt: lv(t.hunt), explore: lv(t.wander) } : { food: drive(t.food, 3), hunt: drive(t.hunt, 1), explore: drive(t.explore, 2) },
  };
}

function genomeCost(g0) {
  const g = normGenome(g0);
  let c = TRAIT_COST[g.vigor] + TRAIT_COST[g.density] + TRAIT_COST[g.sense] + DRIVE_COST[g.taxis.food] + DRIVE_COST[g.taxis.hunt] + DRIVE_COST[g.taxis.explore];
  for (const id of g.genes) c += GENE_BY_ID[id] ? GENE_BY_ID[id].cost : 0;
  return c;
}

function deriveSide(g0) {
  const g = normGenome(g0);
  const G = new Set(g.genes);
  const has = id => G.has(id);
  const v = g.vigor, d = g.density;

const CORE_P = 25 * N + 7, CORE_E = NN - 1 - CORE_P;

function makeDish(levelIdx) {
  const L = LEVELS[levelIdx];
  const r = rng(L.seed);
  const terrain = new Uint8Array(NN), foodType = new Uint8Array(NN), food0 = new Float32Array(NN);
  const pile = new Int16Array(NN).fill(-1), rockHP = new Float32Array(NN);
  const piles = [], lights = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const dx = x - CXf, dy = y - CXf;
    terrain[y * N + x] = (dx * dx + dy * dy <= DISH_R * DISH_R) ? T_AGAR : T_VOID;
  }
  const isCenter = (x, y) => Math.abs(x - CXf) < 0.01 && Math.abs(y - CXf) < 0.01;
  function cells(cx, cy, rad, fn) {
    const out = [];
    for (let y = Math.floor(cy - rad - 1); y <= cy + rad + 1; y++) for (let x = Math.floor(cx - rad - 1); x <= cx + rad + 1; x++) {
      if (x < 0 || y < 0 || x >= N || y >= N) continue;
      const d = Math.hypot(x - cx, y - cy);
      if (d <= rad) { const i = y * N + x; if (terrain[i] !== T_VOID) out.push([i, d / Math.max(rad, 0.01)]); }
    }
    return out;
  }
  const D = {
    rock(cx, cy, rad) {
      for (const [i] of cells(cx, cy, rad)) for (const j of [i, NN - 1 - i]) {
        if (terrain[j] === T_VOID) continue;
        terrain[j] = T_ROCK; rockHP[j] = ROCK_HP; foodType[j] = 0; food0[j] = 0; pile[j] = -1;
      }
    },
    salt(cx, cy, rad) {
      for (const [i] of cells(cx, cy, rad)) for (const j of [i, NN - 1 - i]) if (terrain[j] === T_AGAR || terrain[j] === T_LIGHT) terrain[j] = T_SALT;
    },
    light(cx, cy, rad) {
      for (const [i] of cells(cx, cy, rad)) for (const j of [i, NN - 1 - i]) if (terrain[j] === T_AGAR) terrain[j] = T_LIGHT;
      lights.push({ x: cx, y: cy, r: rad });
      if (!isCenter(cx, cy)) lights.push({ x: N - 1 - cx, y: N - 1 - cy, r: rad });
    },
    disc(cx, cy, rad, fn) { fn(cx, cy, rad); },
    line(x0, y0, x1, y1, w, fn) {
      const len = Math.hypot(x1 - x0, y1 - y0), steps = Math.ceil(len * 2);
      for (let s = 0; s <= steps; s++) { const t = s / steps; fn(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, w); }
    },
    ring(cx, cy, rad, w, gaps, fn) {
      const steps = Math.ceil(rad * Math.PI * 4);
      for (let s = 0; s < steps; s++) {
        const a = s / steps * Math.PI * 2;
        if (gaps.some(g => Math.abs(((a - g + Math.PI * 3) % (Math.PI * 2)) - Math.PI) < 0.32)) continue;
        fn(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, w);
      }
    },
    pile(type, cx, cy, rad, amt) {
      const variants = isCenter(cx, cy) ? [false] : [false, true];
      for (const mir of variants) {
        const id = piles.length, list = [];
        const px = mir ? N - 1 - cx : cx, py = mir ? N - 1 - cy : cy;
        for (const [i, d] of cells(px, py, rad)) {
          if (terrain[i] === T_ROCK) continue;
          foodType[i] = type; food0[i] = 1.8 * amt * (0.55 + 0.45 * (1 - d)); pile[i] = id; list.push(i);
        }
        piles.push({ type, x: px, y: py, cells: list });
      }
    },
  };
  L.gen(D, r);
  for (const c of [CORE_P, CORE_E]) {
    const cx = c % N, cy = Math.floor(c / N);
    for (const [i] of cells(cx, cy, 3.6)) { terrain[i] = T_AGAR; foodType[i] = 0; food0[i] = 0; pile[i] = -1; rockHP[i] = 0; }
  }
  return { terrain, foodType, food0, pile, rockHP, piles, lights, level: levelIdx };
}

// ---------------- Battle ----------------
// A strain is one decentralised organism. Every occupied cell carries a *mass* (0..1, sparse tendril → lace → sheet)
// and a share of stored energy. Each minute the strain's connected fragments are found; a fragment pools its cells'
// energy, earns income from the food it sits on, pays upkeep for its cells, and spends on growth and thickening.
// Cutting a network apart splits its reserves in proportion to cell count; fragments that touch merge. A fragment
// with no food simply starves. Veins come from a routing tree rooted at each fragment's feeding hub: cells attach to
// the neighbour that carried the most flow last minute, so trunks between food sources fatten over time.
const MASS_RATE = 0.025, MASS_DECAY = 0.02, MASS_COST = 0.25;
function Battle(levelIdx, genomeP, genomeE) {
  const dish = makeDish(levelIdx);

  this.terrain = dish.terrain.slice();
  this.food = dish.food0.slice();
  this.rockHP = dish.rockHP.slice();
  this.owner = new Uint8Array(NN);
  this.hp = new Float32Array(NN);
  this.dorm = new Uint8Array(NN);
  this.mass = new Float32Array(NN); this.contest = new Float32Array(NN);
  this.cellE = new Float32Array(NN); this.comp = new Int32Array(NN).fill(-1); this.starv = new Uint8Array(NN); this.isRoot = new Uint8Array(NN);
  this.parent = new Int32Array(NN).fill(-1); this.flow = new Float32Array(NN); this.flowPrev = new Float32Array(NN);
  this.vein = new Float32Array(NN); this.intake = new Float32Array(NN); this.cflag = new Uint8Array(NN);
  this.dist = [null, new Int16Array(NN), new Int16Array(NN)];
  this.fd = [null, new Uint16Array(NN), new Uint16Array(NN)];
  this.ed = [null, new Uint16Array(NN), new Uint16Array(NN)];
  this.bd = [null, new Uint16Array(NN), new Uint16Array(NN)];
  this.dmg = new Float32Array(NN); this.dsrc = new Uint8Array(NN); this.dsrcAmt = new Float32Array(NN);
  this.dby = new Uint8Array(NN);
  this.queue = new Int32Array(NN);
  this.stamp = new Int32Array(NN); this.stampId = 1;
  this.tmpA = new Uint8Array(NN); this.tmpB = new Uint8Array(NN);
  this.candJ = new Int32Array(NN); this.candS = new Float32Array(NN); this.candK = new Uint8Array(NN); this.candF = new Int32Array(NN);
  this.kids = new Uint8Array(NN); this.bq = Array.from({ length: 32 }, () => []); // Dial's buckets: one per distance, modulo 32 (wider than any step cost)
  this.rnd = rng(9001 + levelIdx * 131);
  const mk = (g, core) => {
    const s = deriveSide(g);
    Object.assign(s, {
      energy: 100, core, hub: core, cells: 0, connected: 0, alive: true, growAcc: 0, frags: [], nFrags: 1, bigFrags: 1,
      starving: false, starveTicks: 0, dmgTaken: new Float32Array(8), lost: new Int32Array(8),
      kills: 0, eaten: 0, peak: 0, pilesSeen: new Set(), lastBreach: -99, lastSplit: -99, lastFragStarve: -99, splits: 0, fragStarved: 0, lastLost: core,
      spent: 0, flowMax: 1, massSum: 0, massDorm: 0, contested: 0, pushes: 0, captures: 0, area: 0, retracted: 0, announcedStarve: false, okRun: 0,
      known: new Set(), probes: [], probesSent: 0, probeFinds: 0, scouts: 0,
    });

  };
  this.sides = [null, mk(genomeP, CORE_P), mk(genomeE, CORE_E)];
  for (const s of [1, 2]) {
    const S = this.sides[s];
    const c = S.core;
    this.setCell(c, s, S.maxHP, 1.0);
    for (let k = 0; k < 8; k++) { const j = NB[c * 8 + k]; if (j >= 0 && this.passable(j, S)) this.setCell(j, s, S.maxHP, 0.6); }
    let n = 0; for (let i = 0; i < NN; i++) if (this.owner[i] === s) n++;
    for (let i = 0; i < NN; i++) if (this.owner[i] === s) this.cellE[i] = 100 / n;
  }

  let f0 = 0; for (let i = 0; i < NN; i++) f0 += this.food[i]; this.food0Total = f0;
  this.frames = []; this.events = [];
  this.stats = { cells: [null, [], []], energy: [null, [], []] };
  this.contact = false;
  for (const s of [1, 2]) { this.label(s); this.connect(s); }

Battle.prototype.setCell = function (i, s, hp, mass, comp) {
  this.owner[i] = s; this.hp[i] = hp; this.dorm[i] = 0; this.mass[i] = mass == null ? 0.12 : mass; this.contest[i] = 0;
  this.parent[i] = -1; this.flow[i] = 0; this.cellE[i] = 0; this.starv[i] = 0; this.isRoot[i] = 0; this.comp[i] = comp == null ? -1 : comp;
};
Battle.prototype.passable = function (i, S) {
  const t = this.terrain[i];
  return t !== T_VOID && t !== T_ROCK;
};
Battle.prototype.hpCap = function (i, S) { return S.maxHP * (0.4 + 0.6 * this.mass[i]); };
Battle.prototype.event = function (side, type, cell, extra) {
  this.events.push(Object.assign({ t: this.tick, side, type, cell }, extra || {}));
};
// the fragment pool a cell draws on (falls back to the strain's largest fragment)
Battle.prototype.fragOf = function (i) {
  const S = this.sides[this.owner[i]]; if (!S) return null;
  const c = this.comp[i];
  return (c >= 0 && c < S.frags.length) ? S.frags[c] : S.frags[S.mainFrag] || null;
};

// Fragments: connected components of a strain, each with its pooled energy, and the hub that will root its veins.
Battle.prototype.label = function (s) {
  const S = this.sides[s], owner = this.owner, comp = this.comp, q = this.queue, cellE = this.cellE, mass = this.mass, dorm = this.dorm, starv = this.starv, intake = this.intake, fp = this.flowPrev;
  const frags = S.frags = [];
  for (let i = 0; i < NN; i++) if (owner[i] === s) comp[i] = -1;
  let main = 0;
  for (let i = 0; i < NN; i++) {
    if (owner[i] !== s || comp[i] >= 0) continue;
    const id = frags.length, F = { id, cells: 0, energy: 0, income: 0, massSum: 0, dormCells: 0, starvCells: 0, feeding: 0, hub: i, hubScore: -1, starving: false, maxD: 0 };
    frags.push(F);
    let h = 0, t = 0; q[t++] = i; comp[i] = id;
    while (h < t) {
      const c = q[h++]; F.cells++; F.energy += cellE[c];
      if (dorm[c]) { F.dormCells++; } else F.massSum += mass[c];
      if (starv[c]) F.starvCells++;
      if (intake[c] > 0) F.feeding++;
      const sc = (intake[c] > 0 ? 1000 : 0) + fp[c] + mass[c] * 0.01;
      if (sc > F.hubScore) { F.hubScore = sc; F.hub = c; }
      for (let k = 0; k < 8; k++) { const j = NB[c * 8 + k]; if (j >= 0 && owner[j] === s && comp[j] < 0) { comp[j] = id; q[t++] = j; } }
    }
    F.starving = F.energy <= 0 || (F.energy < 20 && F.starvCells * 2 > F.cells);
    if (F.cells > frags[main].cells) main = id;
  }
  S.mainFrag = main;
  S.nFrags = frags.length;
  S.bigFrags = frags.filter(F => F.cells >= 10).length;
  if (frags.length) { S.hub = frags[main].hub; S.starving = frags[main].starving; }
};

// Routing tree from each fragment's hub. Among equal-distance candidates a cell attaches to the neighbour that
// carried the most flow last minute (positive feedback), and subtree flow (1 per cell + food intake) accumulates.
Battle.prototype.connect = function (s) {
  const S = this.sides[s], dist = this.dist[s], owner = this.owner, q = this.queue, par = this.parent, flow = this.flow, fp = this.flowPrev, intake = this.intake, isRoot = this.isRoot, kids = this.kids, bq = this.bq;
  dist.fill(-1);
  // Dial's bucket queue over the DW/DD step costs: cells settle in order of walking distance, so q lists parents before
  // children. Each cell adds a fixed 0/1 of its own to the cost of stepping onto it, so there is rarely an exact tie and
  // trunks wander a little instead of running dead straight along the grid's diagonals.
  let t = 0, pending = 0;
  for (const F of S.frags) { const r = F.hub; dist[r] = 0; par[r] = -1; bq[0].push(r); pending++; }
  for (let d = 0; pending > 0; d++) {
    const list = bq[d & 31]; if (!list.length) continue;
    for (let n = 0; n < list.length; n++) {
      const i = list[n]; pending--;
      if (dist[i] !== d) continue; // reached by a shorter way since it was queued
      q[t++] = i;
      const fi = fp[i] + ((i * 2654435761) >>> 29) * 0.07;
      for (let k = 0; k < 8; k++) {
        const j = NB[i * 8 + k];
        if (j < 0 || owner[j] !== s) continue;
        const nd = d + (k < 4 ? DW : DD) + (((j * 2246822519) >>> 27) & 1), dj = dist[j];
        if (dj < 0 || nd < dj) { dist[j] = nd; par[j] = i; bq[nd & 31].push(j); pending++; }
        else if (dj === nd) { const p = par[j]; if (fi > fp[p] + ((p * 2654435761) >>> 29) * 0.07) par[j] = i; }
      }
    }
    list.length = 0;
  }
  S.connected = t;
  for (let k = 0; k < t; k++) { flow[q[k]] = 0; kids[q[k]] = 0; }
  for (let k = t - 1; k >= 0; k--) { const i = q[k]; flow[i] += 1 + intake[i] * 6; const p = par[i]; if (p >= 0) { flow[p] += flow[i]; kids[p]++; } }
  let fmax = 8;
  for (const F of S.frags) { if (flow[F.hub] > fmax) fmax = flow[F.hub]; F.maxD = 0; }
  S.flowMax = fmax;
  for (let i = 0; i < NN; i++) {
    if (owner[i] !== s) continue;
    isRoot[i] = 0;
    const F = S.frags[this.comp[i]]; if (F && dist[i] > F.maxD) F.maxD = dist[i];
  }
  for (const F of S.frags) isRoot[F.hub] = 1;
};

// Multi-source walking-distance field (Dial's bucket queue over the DW/DD step costs). `out` holds distance ×DW, 65535
// where unreachable; maxDepth is in cells. stepCost(j) is 0 where impassable, 1 on open ground, more where going is slow.
Battle.prototype.bfsFrom = function (out, isSource, stepCost, maxDepth) {
  const bq = this.bq, lim = maxDepth == null ? 65000 : Math.round(maxDepth * DW);
  out.fill(65535);
  let pending = 0;
  for (let i = 0; i < NN; i++) if (isSource(i)) { out[i] = 0; bq[0].push(i); pending++; }
  for (let d = 0; pending > 0; d++) {
    const list = bq[d & 31]; if (!list.length) continue;
    for (let n = 0; n < list.length; n++) {
      const i = list[n]; pending--;
      if (out[i] !== d) continue;
      for (let k = 0; k < 8; k++) {
        const j = NB[i * 8 + k]; if (j < 0) continue;
        const c = stepCost(j); if (!c) continue;
        const nd = d + (k < 4 ? DW : DD) * c;
        if (nd > lim || nd >= out[j]) continue;
        out[j] = nd; bq[nd & 31].push(j); pending++;
      }
    }
    list.length = 0;
  }
};

// Sensing. A strain only perceives what lies within its sensor range of some cell it owns (walking distance, so
// granite hides things unless the strain can dissolve it, and even then it counts as slow going). Food piles it has
// sensed stay remembered; the rival is only felt while in range. Growth then follows distance fields toward remembered
// food and sensed rival tissue.
const ROCK_STEP = 3; // walking-distance multiplier for granite an acid strain would have to dissolve on the way
Battle.prototype.scent = function (s) {
  const S = this.sides[s], o = 3 - s, terr = this.terrain, food = this.food, ft = this.dish.foodType, owner = this.owner, pile = this.dish.pile, bd = this.bd[s];
  const stepCost = j => { const t = terr[j]; return t === T_VOID ? 0 : t === T_ROCK ? (S.acid ? ROCK_STEP : 0) : 1; };
  const R = S.range * DW;
  this.bfsFrom(bd, i => owner[i] === s, stepCost, S.range);
  for (let i = 0; i < NN; i++) {
    const pid = pile[i];
    if (pid < 0 || bd[i] > R || !S.eat[ft[i]] || S.known.has(pid)) continue;
    S.known.add(pid);
    if (bd[i] > DW && S.probes.length) S.probeFinds++;
    if (bd[i] > 2 * DW && S.scouts < 3 && this.tick > 0) { S.scouts++; this.event(s, 'scout', i, { food: ft[i] }); }

// Exploration. Instead of wandering at random, a strain with Explore sends out up to that many probes at a time:

Battle.prototype.probe = function (s) {

    if (own <= 5 && open >= 2) front.push(i);

};

Battle.prototype.addDmg = function (j, amt, src, by) {
  if (amt <= 0) return;

Battle.prototype.count = function () {
  for (const s of [1, 2]) { const S = this.sides[s]; S.cells = 0; S.dormCells = 0; S.massSum = 0; S.massDorm = 0; S.contested = 0; }

// Spread each fragment's pool back over its cells, so a later cut divides reserves by cell count.

// Famine response. A starving fragment does not wither in place: it pulls back from its periphery and recovers the
// energy held in each withdrawn cell. The body is the reserve. Only tips of the routing tree go (cells with no
// children), so the body never cuts itself apart; among tips the far, thin ones go first, with some jitter so the edge
// frays instead of peeling in a neat ring. Hub, feeding, fighting and contested cells stay. Only a fragment with
// nothing left to withdraw takes starvation damage.

      const p = par[i]; if (p >= 0) kids[p]--;

// Cells mature: mass drifts toward a target set by how surrounded the cell is, how much flow its vein carries,
// whether it is feeding or fighting. Thickening costs the fragment ATP; starving fragments thin out.
Battle.prototype.mature = function () {
  const owner = this.owner, mass = this.mass, flow = this.flow, vein = this.vein, intake = this.intake, cf = this.cflag, dorm = this.dorm;
  for (let i = 0; i < NN; i++) {

Battle.prototype.step = function () {

      const pid = this.dish.pile[i];

    const dc = 0.1 * (push - hold) / (push + hold + 0.01) + (rnd() - 0.5) * 0.03;

    if (K.acid && KF && KF.energy > 1) { this.addDmg(i, 1.2 * c * (O.mucus ? 0.35 : 1), S_ACID, k); KF.energy -= 0.02; }

    for (let i = 0; i < NN; i++) A[i] = (owner[i] === s && !dorm[i]) ? 1 : 0;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      let m = 0; for (let dx = -2; dx <= 2 && !m; dx++) { const xx = x + dx; if (xx >= 0 && xx < N && A[y * N + xx]) m = 1; }
      B[y * N + x] = m;
    }

      const i = y * N + x; if (owner[i] !== o) continue;

      if (m) { this.addDmg(i, 0.55 * (O.mucus ? 0.6 : 1) * (dorm[i] ? 0.4 : 1), S_TOXIN, s); MF.energy -= 0.012; }

        const KF = adj >= 0 ? this.fragOf(adj) : K.frags[K.mainFrag];

  // 11. spores

    }

  // of the plate when the 12-hour incubation ends

  if (p.cells === 0 || e.cells === 0) {

// ===================== Versus: player vs player =====================
// Two browsers find each other through Trystero: public Nostr relays carry only the WebRTC handshake, after which everything
// goes over a direct data channel. No server of ours, no database, no accounts. Both sides run the same deterministic simulation
// from the same inputs (plate, cap, sides, both genomes), so no frames are ever sent: the lobby exchanges settings, ready signals
// carrying the genome to fight, shared strains, and a digest of the verdict once each side has simulated the match.
// Rooms: a player's own code keeps its room open for the whole visit, so the code works even while they try someone else's.
// Entering a code joins a second room. In your own room the first arrival is your opponent; in someone else's room only its
// owner is (two strangers who enter the same code never get paired with each other). If two players enter each other's codes
// they share both rooms; every message carries a sequence number so the copy that arrives through the second room is dropped.

const normCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

const setKey = set => `${set.level}:${set.cap}:${set.swap ? 1 : 0}`;

const oppLabel = () => (S.pvp && S.pvp.them.label) || 'the other player';
function myCode() {
  try { const c = normCode(sessionStorage.getItem('myxo.vs.code')); if (c.length === 6) return c; } catch (e) { }
  const a = new Uint32Array(6); crypto.getRandomValues(a);

  return c;
}

function openVersus() {

    set: { level: playable(S.level) ? S.level : 0, cap: CAP_DEFAULT, swap: false }, setV: 0,
    me: { ready: false, key: '', name: '', genome: null }, them: freshThem(), inbox: [], match: null,

    if (view !== uiState.view) { uiState.view = view; $('bView').hidden = !view; }
  } else if (S.preview) {
    showFrame(S.preview, 0, 0, dt);
  }
  if (cam.auto && !pointers.size) { cam.theta += dt * 0.08; updateCamera(); }
  updateFx(dt);
  if (renderer) renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ===================== Boot =====================
renderProgress();
S.level = Math.max(0, prog.cleared.findIndex(c => !c)); if (prog.cleared.every(Boolean)) S.level = LEVELS.length - 1;
setMode('rack'); renderRack(); previewLevel(S.level);
resize();
requestAnimationFrame(frame);
})();

</script>
