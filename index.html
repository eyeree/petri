<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Myxo Petri Wars</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen lab bench. A lit petri "lightbox" stage plus a specimen panel (left on desktop, below on phones); battle mode gives the stage the whole bench. Single dark look by choice: a lab bench at night. */
:root {
  --bench: #0d1214;
  --bench-2: #121a1d;
  --panel: #151d20;
  --raised: #1c262a;
  --raised-2: #243035;
  --line: #2a363b;
  --ink: #ece5d3;
  --dim: #98a39e;
  --faint: #66736f;
  --gold: #f4c53c;
  --gold-deep: #c8961a;
  --gold-ink: #241a02;
  --rival: #e2508a;
  --rival-deep: #a72b5e;
  --agar: #b9a77e;
  --ok: #9ad17f;
  --bad: #f06a5f;
  --f-display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bench); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 12px; box-sizing: border-box; }
.bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.logo { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: -0.03em; color: var(--gold); line-height: 1; }
.logo span { color: var(--rival); }
.tagline { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
.progress { font-family: var(--f-mono); font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.progress .dots { display: flex; gap: 4px; }
.progress .dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
.progress .dots i.on { background: var(--gold); border-color: var(--gold); }

.main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.stage { position: relative; flex: none; height: 40%; min-height: 220px; border-radius: var(--r-lg); overflow: hidden; background: radial-gradient(120% 90% at 50% 38%, #24302f 0%, #141c1e 48%, #0b1012 100%); box-shadow: inset 0 0 0 1px var(--line); touch-action: none; }
.stage canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.panel { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; border-radius: var(--r-lg); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
#app.mode-battle .stage { flex: 1; height: auto; }
#app.mode-battle .panel { display: none; }
@media (min-width: 880px) {
  .main { flex-direction: row-reverse; }
  .stage { flex: 1; height: auto; }
  .panel { flex: none; width: 420px; }
}

/* ---------- Rack ---------- */
.pad { padding: 18px 18px 22px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.rack h1 { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -0.02em; margin-top: 6px; }
.rack .lede { color: var(--dim); margin: 8px 0 16px; max-width: 62ch; }
.dishes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.dish { width: 100%; display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 10px 12px 10px 10px; border-radius: var(--r-md); background: var(--raised); border: 1px solid var(--line); cursor: pointer; min-height: 72px; }
.dish:hover:not(:disabled) { background: var(--raised-2); }
.dish:disabled { cursor: not-allowed; opacity: 0.5; }
.dish.sel { border-color: var(--gold); }
.dish canvas { width: 56px; height: 56px; border-radius: 50%; display: block; }
.dish .meta { min-width: 0; display: grid; gap: 2px; }
.dish .code { font-family: var(--f-mono); font-size: 11px; color: var(--faint); letter-spacing: 0.08em; }
.dish b { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.15; }
.dish .rv { color: var(--dim); font-size: 12.5px; font-style: italic; }
.chip { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.chip.won { color: var(--gold-ink); background: var(--gold); border-color: var(--gold); }
.chip.ready { color: var(--gold); border-color: var(--gold-deep); }
.howto { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.howto summary { cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 16px; list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
.howto summary::after { content: "+"; font-family: var(--f-mono); color: var(--faint); }
.howto[open] summary::after { content: "–"; }
.howto ol { margin: 10px 0 0; padding-left: 20px; color: var(--dim); display: grid; gap: 6px; max-width: 62ch; }
.howto b { color: var(--ink); font-weight: 600; }
.linkbtn { background: none; border: 0; padding: 8px 0; color: var(--faint); font-family: var(--f-mono); font-size: 11.5px; text-decoration: underline; cursor: pointer; margin-top: 14px; }

/* ---------- Lab ---------- */
.lab { display: flex; flex-direction: column; min-height: 100%; }
.lab-body { padding: 14px 18px 8px; display: grid; gap: 18px; }
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 0; color: var(--dim); cursor: pointer; font-size: 13px; min-height: 36px; }
.lab-title { display: grid; gap: 4px; }
.lab-title h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1.05; letter-spacing: -0.02em; }
.lab-title p { margin: 2px 0 0; color: var(--dim); max-width: 62ch; }
.intel { display: grid; gap: 10px; padding: 12px; border-radius: var(--r-md); background: var(--bench-2); border: 1px solid var(--line); }
.intel .row { display: grid; gap: 6px; }
.intel .lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 9px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); }
.tag .sw { width: 9px; height: 9px; border-radius: 3px; }
.tag.yes { border-color: #4a6b3c; }
.tag.no { border-color: #6b3b38; }
.tag .mk { font-family: var(--f-mono); font-size: 11px; }
.tag.yes .mk { color: var(--ok); } .tag.no .mk { color: var(--bad); }
.rival-name { font-family: var(--f-display); font-weight: 700; font-size: 16px; color: var(--rival); font-style: italic; }
.rival-stats { font-family: var(--f-mono); font-size: 11.5px; color: var(--dim); }
/* the plate's opponent in the lab */
.opp-card { display: grid; gap: 4px; padding: 9px 10px; border-radius: var(--r-sm); background: var(--raised); border: 1px solid var(--line); min-width: 0; }
.opp-card .top { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.opp-card .tg { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.opp-card .kb { font-family: var(--f-mono); font-size: 11px; color: var(--dim); margin-left: auto; }
.opp-card .kb.over { color: var(--rival); }
.opp-card .bl { color: var(--dim); font-size: 12.5px; }
.opp-card .act { justify-self: start; }
.sec { display: grid; gap: 10px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-h h3 { font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.sec-h small { color: var(--faint); font-size: 12px; }
.name-in { width: 100%; box-sizing: border-box; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-sm); color: var(--ink); padding: 10px 12px; font-family: var(--f-display); font-weight: 700; font-size: 17px; min-height: 44px; }
/* Strain: the name row names the strain in the lab (edits save as they happen); the rack below lists every strain, the current one first. */
.strain-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.strain-name { position: relative; min-width: 0; }
.strain-name .name-in { padding-right: 44px; }
.strain-name .refresh-name { display: none; position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; }
.strain-name:focus-within .refresh-name { display: inline-flex; }
.strain-row > .ib { width: 44px; height: 44px; }
.sec-h small.st-err { color: var(--bad); }
.strain-name .name-in[aria-invalid="true"] { border-color: var(--bad); }
.lib { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bench-2); }
.lib summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; font-weight: 600; }
.lib summary::-webkit-details-marker { display: none; }
.lib summary .n { font-family: var(--f-mono); font-size: 12px; font-weight: 400; color: var(--faint); margin-right: auto; }
.lib summary::after { content: "+"; font-family: var(--f-mono); color: var(--faint); }
.lib[open] summary::after { content: "–"; }
.strains { list-style: none; margin: 0; padding: 0 8px 8px; display: grid; gap: 6px; }
.strain { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center; padding: 8px 8px 8px 12px; border-radius: var(--r-sm); background: var(--raised); border: 1px solid var(--line); }
.strain.cur { border-color: var(--gold-deep); }
.strain .pick { min-width: 0; display: grid; gap: 2px; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.strain .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; }
.strain .top b { max-width: 100%; font-family: var(--f-display); font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strain .pick:hover .top b { color: var(--gold); }
.strain .kb { font-family: var(--f-mono); font-size: 11px; color: var(--dim); white-space: nowrap; }
.strain .kb.over { color: var(--bad); }
.strain .sum { font-family: var(--f-mono); font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strain .ib { width: 36px; height: 36px; border-radius: 9px; font-size: 14px; color: var(--dim); }
.strain .ib svg { width: 16px; height: 16px; }
.strain .ib.armed { width: auto; padding: 0 10px; font-family: var(--f-mono); font-size: 12px; color: var(--bad); border-color: var(--bad); }
.strain .ren { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.strain .ren .name-in { flex: 1 1 140px; width: auto; font-size: 15px; min-height: 40px; padding: 6px 10px; }
.strain .ren .name-in[aria-invalid="true"] { border-color: var(--bad); }
.strain .ren .btn { min-height: 40px; padding: 0 14px; }
.strain .ren .err { flex-basis: 100%; color: var(--bad); font-size: 12.5px; }
.trait { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border-radius: var(--r-md); background: var(--raised); border: 1px solid var(--line); }
.trait .tn { font-weight: 600; }
.trait .td { grid-column: 1 / -1; color: var(--dim); font-size: 12.5px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; background: var(--raised-2); border: 1px solid var(--line); cursor: pointer; font-size: 18px; line-height: 1; }
.stepper button:disabled { opacity: 0.35; cursor: not-allowed; }
.pips { display: flex; gap: 3px; padding: 0 6px; }
.pips i { width: 8px; height: 18px; border-radius: 3px; background: var(--raised-2); }
.pips i.on { background: var(--gold); }
.cost { font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.derived { font-family: var(--f-mono); font-size: 11.5px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; }
.derived b { color: var(--ink); font-weight: 500; }
.slider { display: grid; grid-template-columns: 92px 1fr 26px; align-items: center; gap: 10px; min-height: 40px; }
.slider label { font-size: 13px; }
.slider output { font-family: var(--f-mono); font-size: 12px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--raised-2); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--raised-2); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); margin-top: -8px; border: 3px solid var(--panel); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--gold); border: 3px solid var(--panel); }
.genes { display: grid; gap: 6px; }
.gene { display: grid; grid-template-columns: 30px 1fr auto; gap: 2px 10px; align-items: center; text-align: left; width: 100%; padding: 10px 12px 10px 10px; border-radius: var(--r-md); background: var(--raised); border: 1px solid var(--line); cursor: pointer; min-height: 56px; }
.gene .glyph { grid-row: 1 / 3; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.gene .glyph svg { width: 16px; height: 16px; }
.gene .gn { font-weight: 600; }
.gene .gc { font-family: var(--f-mono); font-size: 11px; color: var(--dim); }
.gene .gd { grid-column: 2 / 4; color: var(--dim); font-size: 12.5px; }
.gene[aria-pressed="true"] { background: #2b2a17; border-color: var(--gold-deep); }
.gene[aria-pressed="true"] .glyph { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.gene[aria-pressed="true"] .gc { color: var(--gold); }
.gene.locked { cursor: not-allowed; opacity: 0.45; }
.gene.locked .gd { font-style: italic; }
.gene.cant:not([aria-pressed="true"]) { opacity: 0.7; }
.lab-foot { position: sticky; bottom: 0; margin-top: auto; background: linear-gradient(to top, var(--panel) 75%, transparent); padding: 18px 18px 14px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.budget { display: grid; gap: 6px; }
.budget .bl { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.budget .bl b { color: var(--ink); font-weight: 500; }
.budget.over .bl b { color: var(--bad); }
.meter { height: 8px; border-radius: 4px; background: var(--raised-2); overflow: hidden; position: relative; }
.meter i { display: block; height: 100%; background: var(--gold); border-radius: 4px; transition: width .2s; position: relative; z-index: 1; }
.meter .room { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, rgba(154,209,127,0.35) 0 4px, rgba(154,209,127,0.12) 4px 8px); border-left: 1px solid var(--ok); }
.budget .rise { color: var(--ok); }
.budget.over .meter i { background: var(--bad); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: var(--r-md); background: var(--raised-2); border: 1px solid var(--line); cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-family: var(--f-display); font-weight: 800; font-size: 16px; letter-spacing: 0.01em; }
.btn.primary:disabled { background: var(--raised-2); border-color: var(--line); color: var(--faint); cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }

/* ---------- Battle HUD ---------- */
.hud { position: absolute; left: 0; right: 0; top: 0; padding: 10px 12px 26px; background: linear-gradient(to bottom, rgba(8,12,13,.85), rgba(8,12,13,0)); pointer-events: none; display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px 10px; align-items: start; }
.hud .side { min-width: 0; display: grid; gap: 1px; }
.hud .side.e { text-align: right; }
.hud .sname { font-family: var(--f-display); font-weight: 700; font-size: 15px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud .side.p .sname { color: var(--gold); } .hud .side.e .sname { color: var(--rival); font-style: italic; }
.hud .nums { font-family: var(--f-mono); font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hud .nums b { color: var(--ink); font-weight: 500; }
.hud .clock { text-align: center; display: grid; }
.hud .clock span { font-family: var(--f-mono); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.hud .clock small { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
.hud .clock small.round { color: var(--gold); }
.tug { grid-column: 1 / -1; height: 6px; border-radius: 3px; overflow: hidden; display: flex; background: var(--raised-2); }
.tug i { display: block; height: 100%; transition: width .15s linear; }
.tug .tp { background: var(--gold); } .tug .te { background: var(--rival); margin-left: auto; }
.toast { position: absolute; left: 50%; top: 78px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 7px 12px; border-radius: 999px; background: rgba(13,18,20,.88); border: 1px solid var(--line); font-size: 13px; display: flex; gap: 8px; align-items: center; pointer-events: none; transition: opacity .3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast .tt { font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.toast .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font-family: var(--f-mono); font-size: 11px; color: var(--faint); pointer-events: none; transition: opacity .6s; white-space: nowrap; }
.corner { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.corner .ib { pointer-events: auto; }
.keys { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 10px; padding: 7px 11px; border-radius: 999px; background: rgba(13,18,20,.82); border: 1px solid var(--line); font-family: var(--f-mono); font-size: 10.5px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; max-width: 360px; }
.keys span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.keys i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.keys i.two { background: linear-gradient(90deg, var(--gold) 50%, var(--rival) 50%); border-radius: 2px; }
.vbtn { width: 38px; height: 38px; border-radius: 10px; font-size: 17px; }
.vbtn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
@media (max-width: 600px) { .keys { display: none; } }
.inspect { position: absolute; left: 12px; bottom: 12px; width: min(270px, calc(100% - 24px)); padding: 12px 14px; border-radius: var(--r-md); background: rgba(16,22,24,.94); border: 1px solid var(--line); display: grid; gap: 6px; font-size: 13px; }
.inspect header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.inspect header b { font-family: var(--f-display); font-size: 15px; }
.inspect .x { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; }
.inspect dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
.inspect dt { color: var(--faint); font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; padding-top: 2px; }
.inspect dd { margin: 0; font-variant-numeric: tabular-nums; }
.hpbar { height: 5px; border-radius: 3px; background: var(--raised-2); overflow: hidden; margin-top: 3px; }
.hpbar i { display: block; height: 100%; }

/* ---------- Versus: player vs player ---------- */
.vs-card { margin-top: 18px; padding: 14px; border-radius: var(--r-md); background: var(--bench-2); border: 1px solid var(--line); display: grid; gap: 10px; }

.opp { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-sm); background: var(--raised); border: 1px solid var(--line); }

/* ---------- Transport ---------- */
.transport { flex: none; display: grid; gap: 8px; }

.controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }

@media (max-width: 960px) {

}

// ===================== MYXO SIMULATION =====================
// Deterministic cellular battle between two plasmodia on a petri dish.
const N = 52, NN = N * N, MAXT = 720;
const CXf = (N - 1) / 2, DISH_R = N / 2 - 1.0;
const MID = i => Math.min(i, N * N - 1 - i);
const RSYM = v => v < CXf ? Math.ceil(v - 0.5) : Math.floor(v + 0.5);
// Terrain. Granite (acid dissolves it), the paper of an antibiotic disc and glass beads block growth; granite and glass
// also block sensing (Granite Scent sees through both). A disc's halo is agar that poisons whatever grows on it, and
// chilled agar slows every strain not adapted to the cold.
const T_VOID = 0, T_AGAR = 1, T_ROCK = 2, T_SALT = 3, T_LIGHT = 4, T_DISC = 5, T_HALO = 6, T_GLASS = 7, T_COLD = 8;
const BLOCKS = t => t === T_VOID || t === T_ROCK || t === T_DISC || t === T_GLASS; // no growth onto it
// Food. Mycelial mat spreads over open agar by itself; detritus is left wherever a cell dies, and decays.
const F_NONE = 0, F_SUGAR = 1, F_PROT = 2, F_LIGN = 3, F_MAT = 4, F_OIL = 5, F_DET = 6;
const S_NONE = 0, S_ENGULF = 1, S_ACID = 2, S_TOXIN = 3, S_SALT = 4, S_UV = 5, S_STARVE = 6, S_SEVER = 7;
const SRC_NAMES = ['—', 'Engulfed', 'Acid', 'Antibiotic', 'Salt', 'UV glare', 'Starvation', 'Severed'];
const FOOD_NAMES = ['', 'Oat flakes', 'Bacterial lawn', 'Bark chips', 'Mycelial mat', 'Oil droplets', 'Detritus'];
const ROCK_HP = 14;
const EAT_RATE = [0, 0.5, 0.5, 0.22, 0.4, 0.3, 1.0];
const YIELD = [0, 1.0, 1.25, 2.6, 1.6, 3.0, 1.0];
const MAT_EVERY = 15, MAT_KEEP = 0.4, MAT_SEED = 0.6, MAT_CAP = 260; // mat spread: interval, share of its start a cell needs to spread, share it passes on, cells per plate
const DET_BASE = 4, DET_MASS = 8, DET_DECAY = 0.02; // detritus left by a dead cell: ATP 4 + 8 × its mass, decaying 2%/min
const HALO_DMG = 0.9, COLD_UPKEEP = 0.5, COLD_EAT = 0.3, COLD_GROW = 2.0; // antibiotic halo damage; chilled agar
const LAY_MAT = 160, LAY_DET = 12; // frame layer scale: food amounts shown at full strength

const DX = [1, -1, 0, 0, 1, 1, -1, -1], DY = [0, 0, 1, -1, 1, -1, 1, -1];
const NB = new Int32Array(NN * 8).fill(-1);
// Every plate is mirrored through its centre, so the pink corner sees the gold corner's plate turned half a turn. To keep
// the rules the same for both, every tie the simulation breaks by position is broken in mirror image for pink: OPP[k]
// is the direction opposite k, MIRK[s] the order a side looks at its neighbours in, and MID(i) a key a cell shares with
// its mirror cell. RSYM rounds a coordinate to a cell the same way on both sides of the centre.
const OPP = [1, 0, 3, 2, 7, 6, 5, 4], MIRK = [null, [0, 1, 2, 3, 4, 5, 6, 7], OPP];
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  const i = y * N + x;
  for (let k = 0; k < 8; k++) {
    const nx = x + DX[k], ny = y + DY[k];
    if (nx >= 0 && ny >= 0 && nx < N && ny < N) NB[i * 8 + k] = ny * N + nx;
  }
}

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const GENE_BY_ID = Object.fromEntries(GENES.map(g => [g.id, g]));
const TRAIT_COST = [0, 0, 1, 2, 4, 6]; // index by level 1..5
const DRIVE_COST = [0, 0, 1, 2, 3, 5]; // index by level 0..5: a drive at 0 is free and switched off
const SENSE_RANGE = [0, 5, 9, 13, 18, 26]; // cells a strain can sense from any cell it owns, by Sensor range level 1..5
const PROBE_EVERY = 10, PROBE_TTL = 30, PROBE_REACH = 22; // exploration spikes: refill interval, lifetime, length (cells)
const DOM_SHARE = 0.9, DOM_TICKS = 30, DOM_MIN = 200; // overrun: hold 90% of living tissue for 30 min with a real body
const RETRACT_RATE = 0.02, RETRACT_UNTIL = 20; // a starving fragment withdraws up to 2% of its cells a minute until its pool is back above 20 ATP
const RETRACT_JITTER = 3; // cells of randomness in the withdrawal order, so a famine frays the edge instead of peeling a neat ring
const GROW_TENSION = 0.03; // growth score per own neighbour of a candidate cell: fronts stay cohesive instead of fraying into threads
// Walking distance: a straight step costs DW, a diagonal DD (7/5 ≈ √2). Distance fields are therefore near-Euclidean, in
// units of 1/DW cell, and their level sets are octagons rather than the squares a plain 8-neighbour BFS produces.
const DW = 5, DD = 7, DI = 1 / DW;
const cl01 = (v, a, b) => Math.max(a, Math.min(b, v));

// Genomes: { vigor 1-5, density 1-5, sense 1-5, genes [], taxis { food 0-5, hunt 0-5, explore 0-5 } }.
// Older saves carried free 0-10 food/hunt/wander ratios; they are folded into the new absolute drives here.
function normGenome(g) {
  const t = (g && g.taxis) || {};
  const old = 'wander' in t || t.food > 5 || t.hunt > 5;
  const lv = v => cl01(Math.floor((v || 0) / 2), 0, 5);
  const drive = (v, dflt) => cl01(Math.round(v == null ? dflt : v), 0, 5);
  return {
    vigor: cl01(Math.round(g.vigor || 2), 1, 5), density: cl01(Math.round(g.density || 2), 1, 5), sense: cl01(Math.round(g.sense || 2), 1, 5),
    genes: (g.genes || []).map(id => id === 'fragment' ? 'granules' : id),
    taxis: old ? { food: lv(t.food), hunt: lv(t.hunt), explore: lv(t.wander) } : { food: drive(t.food, 3), hunt: drive(t.hunt, 1), explore: drive(t.explore, 2) },
  };
}

function genomeCost(g0) {
  const g = normGenome(g0);
  let c = TRAIT_COST[g.vigor] + TRAIT_COST[g.density] + TRAIT_COST[g.sense] + DRIVE_COST[g.taxis.food] + DRIVE_COST[g.taxis.hunt] + DRIVE_COST[g.taxis.explore];
  for (const id of g.genes) c += GENE_BY_ID[id] ? GENE_BY_ID[id].cost : 0;
  return c;
}

function deriveSide(g0) {
  const g = normGenome(g0);
  const G = new Set(g.genes);
  const has = id => G.has(id);
  const v = g.vigor, d = g.density;
  let costly = 0; for (const id of g.genes) if (GENE_BY_ID[id] && GENE_BY_ID[id].cost >= 2) costly++;
  const torpor = has('torpor') ? 0.7 : 1;
  return {
    g, has, vigor: v, density: d, sense: g.sense, range: SENSE_RANGE[g.sense],
    acid: has('acid'), chitin: has('chitin'), mucus: has('mucus'), osmo: has('osmo'), sclero: has('sclero'),
    regen: has('regen'), toxin: has('toxin'), spores: has('spores'), prune: has('prune'), granules: has('granules'),
    chloro: has('chloro'), necro: has('necro'), sapro: has('sapro'), thermo: has('thermo'), circadian: has('circadian'),
    melanin: has('melanin'), efflux: has('efflux'), antifreeze: has('antifreeze'), encyst: has('encyst'), photolyase: has('photolyase'),
    cryptic: has('cryptic'), brine: has('brine'), lytic: has('lytic'), surge: has('surge'), anast: has('anast'), tipdom: has('tipdom'),
    nomad: has('nomad'), armour: has('armour'), rockscent: has('rockscent'), rmem: has('rmem'), negphoto: has('negphoto'), shun: has('shun'),
    eat: [false, has('amylase'), has('protease'), has('ligninase'), has('chitinase'), has('lipase'), has('sapro')],
    maxHP: 12 + d * 6,
    growCost: (1.0 + d * 0.5) * (has('chitin') ? 1.15 : 1),
    engulf: (0.8 + d * 0.4) * (has('crush') ? 1.6 : 1),
    k0: (0.4 + v * 0.45) * torpor, k1: 0.035 * v * torpor,
    upkeep: Math.max(0.002, 0.0035 + d * 0.0018 + v * 0.0016 + costly * 0.0004 - (has('prune') ? 0.0012 : 0) + (has('armour') ? 0.0008 : 0)) * torpor,
    wF: g.taxis.food / 5, wH: g.taxis.hunt / 5, explore: g.taxis.explore,
    reach: PROBE_REACH * (has('tipdom') ? 1.5 : 1), ttl: PROBE_TTL * (has('tipdom') ? 1.5 : 1), tension: GROW_TENSION * (has('tipdom') ? 0.5 : 1),
  };
}

// Lay out plate levelIdx from its records. The layout ops are the only things a record can name.
function makeDish(levelIdx) {
  const L = LEVELS[levelIdx];
  const terrain = new Uint8Array(NN), foodType = new Uint8Array(NN), food0 = new Float32Array(NN);
  const pile = new Int16Array(NN).fill(-1), rockHP = new Float32Array(NN);

  }
  const isCenter = (x, y) => Math.abs(x - CXf) < 0.01 && Math.abs(y - CXf) < 0.01;

    const out = [];

      if (x < 0 || y < 0 || x >= N || y >= N) continue;

    }
    return out;
  }
  const both = (cx, cy, rad, fn) => { for (const [i] of cells(cx, cy, rad)) for (const j of [i, NN - 1 - i]) if (terrain[j] !== T_VOID) fn(j); };
  const wall = (j, t) => { terrain[j] = t; rockHP[j] = t === T_ROCK ? ROCK_HP : 0; foodType[j] = 0; food0[j] = 0; pile[j] = -1; };
  const D = {
    rock(cx, cy, rad) { both(cx, cy, rad, j => wall(j, T_ROCK)); },
    glass(cx, cy, rad) { both(cx, cy, rad, j => wall(j, T_GLASS)); },
    salt(cx, cy, rad) { both(cx, cy, rad, j => { if (terrain[j] === T_AGAR || terrain[j] === T_LIGHT || terrain[j] === T_COLD) terrain[j] = T_SALT; }); },
    cold(cx, cy, rad) { both(cx, cy, rad, j => { if (terrain[j] === T_AGAR) terrain[j] = T_COLD; }); },
    light(cx, cy, rad) {
      both(cx, cy, rad, j => { if (terrain[j] === T_AGAR || terrain[j] === T_COLD) terrain[j] = T_LIGHT; });
      lights.push({ x: cx, y: cy, r: rad });
      if (!isCenter(cx, cy)) lights.push({ x: N - 1 - cx, y: N - 1 - cy, r: rad });
    },
    // an antibiotic disc: the paper itself is impassable; the antibiotic soaks the agar around it
    abx(cx, cy) {
      both(cx, cy, 4, j => { if (terrain[j] === T_AGAR || terrain[j] === T_COLD) terrain[j] = T_HALO; });

    ring(cx, cy, rad, w, gaps, op) {

    pile(type, cx, cy, rad, amt) {
      const variants = isCenter(cx, cy) ? [false] : [false, true];

        const id = piles.length, list = [];
        const px = mir ? N - 1 - cx : cx, py = mir ? N - 1 - cy : cy;

    mat(cx, cy, rad, amt) { D.pile(F_MAT, cx, cy, rad, amt); },
  };

  for (const [op, ...a] of L.layout) if (OPS.includes(op)) D[op](...a);
  for (const c of [CORE_P, CORE_E]) {
    const cx = c % N, cy = Math.floor(c / N);
    for (const [i] of cells(cx, cy, 3.6)) { terrain[i] = T_AGAR; foodType[i] = 0; food0[i] = 0; pile[i] = -1; rockHP[i] = 0; }
  }
  return { terrain, foodType, food0, pile, rockHP, piles, lights, discs, cycle: L.cycle || 0, level: levelIdx };
}

Battle.prototype.setCell = function (i, s, hp, mass, comp) {

Battle.prototype.passable = function (i, S) { return !BLOCKS(this.terrain[i]); };

Battle.prototype.hpCap = function (i, S) { return S.maxHP * (0.4 + 0.6 * this.mass[i]) * (S.armour && this.vein[i] >= 0.5 ? 1.4 : 1); };

Battle.prototype.ownN = function (i, s) { let n = 0; for (let k = 0; k < 8; k++) { const j = NB[i * 8 + k]; if (j >= 0 && this.owner[j] === s) n++; } return n; };

// --- scrubber ---
// The share graph is only drawn as far as the viewer has watched (S.revealed); the rest sits under fog, so a first
// viewing never leaks the outcome. Once the end has been seen the timeline shrinks to the real battle length.
const scrub = $('scrub'); const sg = scrub.getContext('2d');
let scrubDrag = null;
function endSeen() { const b = S.battle; return !!(b && b.done && S.revealed >= b.frames.length - 1 - 0.5); }
function timelineTotal() { return endSeen() ? S.battle.frames.length - 1 : MAXT; }
function drawScrub() {
  const b = S.battle; if (!b) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2), w = scrub.clientWidth, h = scrub.clientHeight;
  if (scrub.width !== Math.round(w * dpr) || scrub.height !== Math.round(h * dpr)) { scrub.width = Math.round(w * dpr); scrub.height = Math.round(h * dpr); }
  sg.setTransform(dpr, 0, 0, dpr, 0, 0); sg.clearRect(0, 0, w, h);
  const total = timelineTotal();
  const nR = Math.min(b.frames.length - 1, Math.ceil(S.revealed));
  const X = t => 6 + (t / Math.max(total, 1)) * (w - 12);
  const top = 10, bot = h - 6, H = bot - top;
  // fog over what hasn't been watched yet
  sg.fillStyle = 'rgba(255,255,255,0.03)'; sg.fillRect(X(nR), top, X(total) - X(nR), H);
  if (nR < total) {
    sg.save(); sg.strokeStyle = 'rgba(255,255,255,0.05)'; sg.lineWidth = 1; sg.beginPath();
    for (let x = Math.ceil(X(nR) / 7) * 7; x < X(total); x += 7) { sg.moveTo(x, top); sg.lineTo(x - 6, bot); }
    sg.stroke(); sg.restore();
  }
  // share area: gold bottom, rival top
  const share = t => { const p = b.stats.cells[1][t], e = b.stats.cells[2][t]; return p / Math.max(p + e, 1); };
  sg.beginPath(); sg.moveTo(X(0), bot);
  for (let t = 0; t <= nR; t++) sg.lineTo(X(t), bot - H * share(t));
  sg.lineTo(X(nR), bot); sg.closePath(); sg.fillStyle = 'rgba(244,197,60,0.55)'; sg.fill();
  sg.beginPath(); sg.moveTo(X(0), top);
  for (let t = 0; t <= nR; t++) sg.lineTo(X(t), bot - H * share(t));
  sg.lineTo(X(nR), top); sg.closePath(); sg.fillStyle = 'rgba(226,80,138,0.45)'; sg.fill();
  // nights on a plate whose lamp cycles
  if (b.cycle) { sg.fillStyle = 'rgba(8,14,40,0.32)'; for (let t0 = b.cycle / 2; t0 < total; t0 += b.cycle) sg.fillRect(X(t0), top, X(Math.min(total, t0 + b.cycle / 2)) - X(t0), H); }
  // reveal edge
  if (nR < total) { sg.fillStyle = 'rgba(236,229,211,0.25)'; sg.fillRect(Math.round(X(nR)), top, 1, H); }
  sg.strokeStyle = 'rgba(255,255,255,0.15)'; sg.lineWidth = 1; sg.beginPath(); sg.moveTo(X(0), top + H / 2); sg.lineTo(X(total), top + H / 2); sg.stroke();
  // hour ticks
  sg.fillStyle = 'rgba(255,255,255,0.18)';
  for (let hr = 1; hr * 60 < total; hr++) sg.fillRect(Math.round(X(hr * 60)), bot - 3, 1, 3);
  // events seen so far
  for (const ev of b.events) {
    if (ev.t > S.revealed + 0.001) break;
    sg.fillStyle = evColor(ev);
    const big = ev.type === 'split' || ev.type === 'end' || ev.type === 'contact';
    sg.beginPath(); sg.arc(X(ev.t), 5, big ? 3.2 : 2, 0, Math.PI * 2); sg.fill();
  }
  // playhead
  const px = X(S.playhead);

}

scrub.addEventListener('pointerdown', e => { try { scrub.setPointerCapture(e.pointerId); } catch (err) { } scrubDrag = { was: S.playing }; S.playing = false; setPlayIcon(); scrubAt(e.clientX); });

// --- transport buttons ---
function togglePlay() {

  if (ev) { seek(ev.t); fireEvents(ev.t - 1, ev.t); if (ev.cell >= 0 && ev.type !== 'end') selectCell(ev.cell); }

// Speed slider, real time to 10000×. Below about 60× a minute of incubation takes over a second and the dish looks

const travelAt = v => Math.pow(Math.log10(v) / Math.log10(SPEED_MAX), 1 / SPEED_P); // rate → slider travel
const niceSpeed = x => { const p = Math.max(1, Math.pow(10, Math.floor(Math.log10(x)) - 1)); return clamp(Math.round(x / p) * p, 1, SPEED_MAX); };
function showSpeed(v) {

}
function setSpeed(v) { showSpeed(v); speedIn.value = Math.round(travelAt(v) * SPEED_STEPS); }
speedIn.addEventListener('input', () => showSpeed(niceSpeed(speedAt(speedIn.value / SPEED_STEPS))));

    const status = [(f & 4) ? 'dormant' : '', (f & 8) ? `hub · ${Math.round((F.route[i] >> 4) / 15 * 100)}% weight` : ''].filter(Boolean).join(', ');
    occ = `<dd><span style="color:${o === 1 ? COL.p : COL.e};font-weight:600">${esc(sideName(o))}</span>${status ? ' · ' + status : ''}<div>${hpv.toFixed(1)} / ${Sd.maxHP} HP</div><div class="hpbar"><i style="width:${hpv / Sd.maxHP * 100}%;background:${o === 1 ? COL.p : COL.e}"></i></div></dd>`;

    <dl><dt>Ground</dt><dd>${terr}</dd><dt>Food</dt><dd>${food}</dd><dt>Occupant</dt>${occ}${body}${hurt}</dl>`;

// Field notes on one round from this player's side: what cost them, and which gene or trait would answer it.
function analyze(M, b) {
  const me = M.me, P = b.sides[me], E = b.sides[3 - me], g = P.g, R0 = b.result, won = R0.winner === me, notes = [];
  const has = id => g.genes.includes(id), iso = id => isolated(GENE_BY_ID[id]);
  const per = (v, unit) => `${Math.round(v)} ${unit}${Math.round(v) === 1 ? '' : 's'}`;
  const dmgTot = P.dmgTaken.reduce((a, x) => a + x, 0) || 1, share = k => P.dmgTaken[k] / dmgTot;
  const uneaten = [0, 0, 0, 0, 0, 0, 0];
  for (let i = 0; i < NN; i++) if (b.dish.food0[i] > 0 && !P.eat[b.dish.foodType[i]]) uneaten[b.dish.foodType[i]] += b.dish.food0[i];
  // mycelial mat spreads during play, so what the rival made of it is the better measure
  if (!P.eat[F_MAT] && uneaten[F_MAT]) uneaten[F_MAT] = Math.max(uneaten[F_MAT], E.eatenBy[F_MAT] / YIELD[F_MAT]);
  for (const f of [5, 4, 3, 2, 1]) if (uneaten[f] > 250) {
    const G = GENE_BY_ID[FOOD_ENZ[f]];
    notes.push(`${FOOD_NAMES[f]} sat untouched: about ${Math.round(uneaten[f] * YIELD[f])} ATP your strain couldn’t digest. ${iso(G.id) ? G.name + ' would unlock it.' : 'You’ll need an enzyme you haven’t isolated yet.'}`);
  }
  const missed = [0, 0, 0, 0];
  b.dish.piles.forEach((pl, pid) => { if (P.eat[pl.type] && !P.known.has(pid)) for (const i of pl.cells) missed[pl.type] += b.dish.food0[i]; });
  for (const f of [5, 3, 2, 1]) if (missed[f] > 150) notes.push(`${FOOD_NAMES[f]} worth about ${Math.round(missed[f] * YIELD[f])} ATP was never discovered. Raise Sensor range or Explore to find it.`);
  if (b.bareTick > 0 && P.retracted > 50) notes.push(`The plate was eaten bare at ${fmt(b.bareTick)}; your strain pulled back about ${Math.round(P.retracted)} cells to live on its reserves. Holding regrowing bacterial lawns, Vein Pruning and lower Density all stretch a famine; a faster kill avoids it.`);
  else if (P.starveTicks > 30) notes.push(`Your strain starved for about ${Math.round(P.starveTicks)} min. It grew faster than it could feed: lower Vigor or Density, add Vein Pruning, or raise Seek food.`);
  if (share(S_ACID) > 0.3 && !has('mucus')) notes.push(`Acid did ${Math.round(share(S_ACID) * 100)}% of your damage. ${iso('mucus') ? 'Alkaline Slime neutralises most of it.' : 'A slime gene against acid is coming.'}`);
  if (share(S_ENGULF) > 0.45 && !has('chitin') && P.lost[S_ENGULF] > 40) notes.push(`Engulfing did ${Math.round(share(S_ENGULF) * 100)}% of your damage. Chitin Rind halves it; more Density makes cells tougher.`);
  if (share(S_TOXIN) > 0.2 && !has('mucus')) notes.push('The rival’s antibiotic haze ate your front line. Alkaline Slime blunts it.');
  if (P.lost[S_SALT] > 15 && !has('osmo')) notes.push(`${per(P.lost[S_SALT], 'cell')} died on salt crust. ${iso('osmo') ? 'Osmotic Pumps make you immune.' : 'Lower Explore so growth stays off the crust.'}`);
  if (P.lost[S_UV] > 15 && !has('chloro')) notes.push(`${per(P.lost[S_UV], 'cell')} burned under the lamp. ${iso('chloro') ? `An Algal Symbiont turns that light into food${has('melanin') ? '' : '; Melanin, for 1 kb, just blocks most of the glare'}.` : 'Lower Explore to keep out of the light.'}`);
  if (P.haloDmg > 60 && !has('efflux')) notes.push(`Antibiotic halos did about ${Math.round(P.haloDmg)} damage to your cells. ${iso('efflux') ? 'Efflux Pumps make you immune' : 'An answer to antibiotics is coming'}${has('mucus') ? '' : '; Alkaline Slime halves it'}.`);
  if (E.eatenBy[F_DET] > 200 && !has('sapro')) notes.push(`${sideName(3 - me, b)} fed about ${Math.round(E.eatenBy[F_DET])} ATP on the dead of the battle line. ${iso('sapro') ? 'Saprotrophy eats detritus too; or keep the fight short.' : 'Keep the fight short, or don’t feed it one.'}`);
  if (P.lost[S_SEVER] > 20 && !has('armour')) notes.push(`Lytic enzymes severed ${per(P.lost[S_SEVER], 'cell')} on your veins. ${iso('armour') ? 'Sclerotised Veins halve the damage to trunks' : 'Keep veins short'}${iso('anast') && !has('anast') ? '; Anastomosis rejoins the pieces' : ''}.`);
  if (P.coldLost > 150 && !has('antifreeze')) notes.push(`On chilled agar your strain ate at a third of the rate, about ${Math.round(P.coldLost)} ATP short. ${iso('antifreeze') ? 'Antifreeze Proteins give full rate; Thermogenesis keeps a dense sheet warm.' : 'Something for the cold is coming.'}`);
  if (b.cycle && P.nightStarve > 20 && !has('circadian')) notes.push(`Your strain starved for ${per(P.nightStarve, 'minute')} in the dark. ${iso('circadian') ? 'Circadian Reserve banks the day’s food for the night' : 'Food that does not need the lamp keeps it fed at night'}${has('chloro') ? '; a lamp-fed strain has no income at all once it is off' : ''}.`);
  if (P.migrations >= 2) notes.push(`Your strain picked itself up and streamed to new food ${per(P.migrations, 'time')}.`);
  if (P.splits >= 2 || P.fragStarved >= 2) notes.push(`Your network was cut apart ${per(P.splits, 'time')} and ${per(P.fragStarved, 'cut-off fragment')} starved. Keep fronts broad${iso('anast') && !has('anast') ? ', take Anastomosis to rejoin the pieces' : ''}${iso('encyst') && !has('encyst') ? ', or Encystment so small pieces sleep instead' : iso('granules') && !has('granules') ? ', or take Reserve Granules so fragments can wait for food' : ''}.`);
  const rocks = b.dish.terrain.some(t => t === T_ROCK);
  if (rocks && !has('acid') && !won && E.acid) notes.push(`${sideName(3 - me, b)} burned through granite you had to walk around. ${iso('acid') ? 'Oxalic Acid opens the same shortcuts.' : ''}`);
  if (!won && R0.reason === 'time') notes.push('Whatever is alive at 12:00 decides a round that is not overrun. Raise Hunt rival to press the attack, hold the regrowing lawns, or lower upkeep so your body outlasts the famine.');
  if (!won && b.level === 0 && R0.reason !== 'time' && g.taxis.explore >= 2 && P.probesSent > 20) notes.push('On a plate this small, exploring costs more than it finds: every spike is growth that is not fighting or eating. Lower Explore or Seek food and spend the kilobases elsewhere.');
  if (won && !notes.length) notes.push(R0.reason === 'elim' ? `A clean kill at ${fmt(R0.tick)}. Try a cheaper genome to see how lean a winning strain can be.` : 'You won on territory. A harder-hitting front could finish the rival outright.');
  return notes.slice(0, 4);
}
// The picked round in detail: both sides' numbers, this player's losses by cause and the field notes.
function roundDetail(M, b) {
  const me = M.me, P = b.sides[me], E = b.sides[3 - me];
  const lostBy = [1, 2, 3, 4, 5, 6, 7].map(k => P.lost[k]), lostAll = lostBy.reduce((a, x) => a + x, 0);
  const lossBar = lostAll ? [1, 2, 3, 4, 5, 6, 7].filter(k => lostBy[k - 1]).map(k => `<i style="width:${lostBy[k - 1] / lostAll * 100}%;background:${SRC_COL[k]}" title="${SRC_NAMES[k]}"></i>`).join('') : '';
  const legend = [1, 2, 3, 4, 5, 6, 7].filter(k => lostBy[k - 1]).map(k => `<span><i style="background:${SRC_COL[k]}"></i>${SRC_NAMES[k]} ${lostBy[k - 1]}</span>`).join('');
  const stat = (lbl, a, c) => `<div class="stat"><small>${lbl}</small><b>${Math.round(a)}</b> <span class="vs">/ ${Math.round(c)}</span></div>`;
  return `<div class="sub-h">Round ${b.round + 1} · you / ${esc(M.names[3 - me])}</div>
    <div class="stats">${stat('Peak cells', P.peak, E.peak)}${stat('ATP eaten', P.eaten, E.eaten)}${stat('Kills', P.kills, E.kills)}</div>
    ${lostAll ? `<div class="losses"><div class="sub-h">Your ${lostAll} lost cells, by cause</div><div class="bar2">${lossBar}</div><div class="legend">${legend}</div></div>` : ''}
    <div><div class="sub-h">Field notes</div><ul class="notes">${analyze(M, b).map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>`;
}
// One line on how a round ended, told from the loser's side.
function roundHow(b) {
  const R0 = b.result, W = b.sides[R0.winner], Lz = b.sides[3 - R0.winner], ln = sideName(3 - R0.winner, b);
  if (R0.reason === 'elim') return `${ln} was wiped from the plate`;
  if (R0.reason === 'dom') return `${ln} was overrun, down to ${Math.round((1 - R0.share) * 100)}% of the tissue`;
  return `${W.cells} cells to ${Lz.cells} when incubation ended`;
}
function openSummary() { S.playing = false; setPlayIcon(); cancelCountdown(); showSummary(); }
function closeSummary() { const M = S.match; if (M && M.reviewed && !M.summaryPending) $('result').hidden = true; }
// The match summary. Opening it ends the first run through the match: from here every showing is a replay, so no
// round advances by itself and nothing is fogged. A replay watched to its end brings the summary back; one scrubbed
// or stepped to the end does not. The verdict reads across the match; the rest of the card details the round picked
// from the list (the one on show, to begin with). Picking a round also puts it on the stage behind the summary, and
// its Rewatch button plays it again from the start. Opened before the match is decided, the summary waits for the
// remaining rounds, which the frame loop then simulates at full tilt.
function showSummary() {
  const M = S.match; if (!M) return;
  M.reviewed = true;
  const R = $('result');
  if (!M.decided) {
    M.summaryPending = true;
    R.innerHTML = `<div class="card" role="dialog" aria-label="Match summary"><div><div class="eyebrow">${plateLabel(M)}</div><div class="mtitle">Finishing the incubations…</div><div class="why">The remaining rounds are being simulated.</div></div></div>`;
    R.hidden = false; return;
  }
  M.summaryPending = false;
  const me = M.me, rs = M.rounds.slice(0, M.played), win = M.winner === me, vs = M.pvp, rv = M.names[3 - me], w = M.wins[me], l = M.wins[3 - me];
  if (!M.newGenes) { // settled once: the summary is shown again after every rewatch
    M.newGenes = [];
    if (win && !vs) {
      if (!prog.cleared[M.level]) { prog.cleared[M.level] = true; M.newGenes = GENES.filter(G => G.unlock === M.level + 2); }
      save(); renderProgress();
    }
  }
  const nextL = LEVELS[M.level + 1], newKb = M.newGenes.reduce((a, G) => a + G.cost, 0), rise = nextL ? nextL.budget - LEVELS[M.level].budget : 0;
  let why = (win ? `You took ${w} of ${rs.length} round${rs.length === 1 ? '' : 's'}` : `${rv} took ${l} of ${rs.length} round${rs.length === 1 ? '' : 's'}`) + (rs.length < M.n ? `, settling a best of ${M.n} early.` : '.');
  if (w && l) {
    const shares = rs.map(b => { const p = b.sides[me].cells, e = b.sides[3 - me].cells; return Math.round(p / Math.max(p + e, 1) * 100); });
    why += ` Nothing but the seed changed between the rounds, so this match-up is close: your share of the living tissue at the end ran from ${Math.min(...shares)}% to ${Math.max(...shares)}%.`;
  } else why += win ? ' A clean sweep.' : ' Not one went your way.';
  const cur = rs.includes(S.battle) ? S.battle : rs[rs.length - 1];
  const rows = rs.map((b, k) => `<li data-round="${k}" tabindex="0" aria-current="${cur === b}"${cur === b ? ' class="cur"' : ''} title="Show round ${k + 1} in detail"><i class="dot" style="background:${b.result.winner === 1 ? COL.p : COL.e}"></i><span class="rn">Round ${k + 1} · ${fmt(b.result.tick)}</span><span class="how"><span class="rw">${b.result.winner === me ? 'Won' : 'Lost'}</span> · ${esc(roundHow(b))}</span><button class="btn" data-rewatch="${k}" title="Watch round ${k + 1} again from the start">Rewatch ›</button></li>`).join('');
  const next = !vs && M.level + 1 < LEVELS.length && playable(M.level + 1);
  R.innerHTML = `<div class="card" role="dialog" aria-label="Match summary">
    <div><div class="eyebrow"><span>${plateLabel(M)} · Best of ${M.n}</span><button class="x" id="rClose" aria-label="Close the summary" title="Close (Esc)">✕</button></div><div class="verdict ${win ? 'win' : 'lose'}">${win ? 'Dish conquered' : 'Overrun'}</div><div class="why">${esc(why)}</div></div>
    ${M.newGenes.length ? `<div class="reward"><div class="sub-h">New genes isolated</div><b>${M.newGenes.map(G => esc(G.name)).join(' · ')}</b><div class="note">${newKb} kb of new options; your budget rose by ${rise}, to ${nextL.budget} kb on ${nextL.code}. ${M.newGenes.length === 1 ? 'It is' : 'They are'} in the gene lab now: choose among them, or trim what you carry to make room.</div></div>` : ''}
    ${!vs && win && M.level === LEVELS.length - 1 ? '<div class="unlock">Every plate on the rack is yours. Try beating each dish with a smaller genome.</div>' : ''}
    ${vs ? `<div class="unlock" id="vsNote">${pvpResultNote(vs)}</div>` : ''}
    <ol class="rounds" aria-label="Rounds">${rows}</ol>
    <div class="rdetail" id="rdetail">${roundDetail(M, cur)}</div>
    <div class="acts">
      <button class="btn${win && next ? '' : ' primary'}" id="rLab">${vs ? 'Back to the match' : 'Revise genome'}</button>
      ${win && next ? '<button class="btn primary" id="rNext">Next dish</button>' : ''}
    </div></div>`;
  R.hidden = false;
  R.querySelectorAll('.rounds li').forEach(li => {
    li.addEventListener('click', () => selectRound(+li.dataset.round));
    li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); selectRound(+li.dataset.round); } });
  });
  R.querySelectorAll('[data-rewatch]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); viewRound(+b.dataset.rewatch, true); }));
  $('rClose').addEventListener('click', closeSummary);
  $('rLab').addEventListener('click', () => openLab(M.level));
  if ($('rNext')) $('rNext').addEventListener('click', () => openLab(M.level + 1));
}

// ===================== Loop =====================
let lastT = performance.now(), uiState = { keys: null, view: null };
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  const time = now / 1000;
  if (S.anim) surfUniforms.uTime.value = time;
  beamMat.uniforms.uTime.value = time; probeMat.uniforms.uTime.value = time;
  if (S.mode === 'battle' && S.match && S.battle) {
    const M = S.match, b = S.battle;
    stepMatch(M.summaryPending ? 40 : b.frames.length - S.playhead < 60 ? 14 : 6);
    if (M.decided && M.pvp && !M.pvp.settled) pvpSettle(M);
    if (M.summaryPending && M.decided) showSummary();
    if (S.playing) {
      const prev = S.playhead;
      S.playhead = Math.min(lastTick(), S.playhead + dt * S.speed / TICK_SEC);
      fireEvents(prev, S.playhead);
    }
    if (S.playhead > S.revealed) S.revealed = S.playhead;
    if (visibleEvents() !== S.logN) { renderLog(); S.shownEvt = -1; }
    if (b.done && S.playhead >= lastTick() - 0.01 && !S.resultShown && !scrubDrag) {
      const watched = S.playing; // reached by watching; a seek to the end (scrubber, step or jump) arrives paused
      S.playing = false; setPlayIcon(); S.resultShown = true;
      if (!M.reviewed) setTimeout(() => { if (S.mode === 'battle' && S.battle === b) roundOver(b); }, 700);
      else if (watched) setTimeout(() => { if (S.mode === 'battle' && S.battle === b && S.playhead >= lastTick() - 0.01) openSummary(); }, 700);
    }
    const t = Math.floor(S.playhead);
    showFrame(b, t, S.playhead - t, dt);
    updateHud(); updateToast(); drawScrub(); updateInspect();
    const keys = cam.zoom < 0.55, view = viewMoved() || Math.abs(cam.theta) > 0.05;
    if (keys !== uiState.keys) { uiState.keys = keys; $('keys').hidden = !keys; }
    if (view !== uiState.view) { uiState.view = view; $('bView').hidden = !view; }
  } else if (S.preview) {
    showFrame(S.preview, 0, 0, dt);
  }
  if (cam.auto && !pointers.size) { cam.theta += dt * 0.08; updateCamera(); }
  updateFx(dt);
  if (renderer) renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ===================== Boot =====================
renderProgress();
S.level = Math.max(0, prog.cleared.findIndex(c => !c)); if (prog.cleared.every(Boolean)) S.level = LEVELS.length - 1;
setMode('rack'); renderRack(); previewLevel(S.level);
resize();
requestAnimationFrame(frame);
})();

</script>

</body></html>
