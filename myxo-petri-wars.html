<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Myxo Petri Wars</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen lab bench. A lit petri "lightbox" stage plus a specimen panel (left on desktop, below on phones); battle mode gives the stage the whole bench. Single dark look by choice: a lab bench at night. */
:root {
  --bench: #0d1214;
  --bench-2: #121a1d;
  --panel: #151d20;
  --raised: #1c262a;
  --raised-2: #243035;
  --line: #2a363b;
  --ink: #ece5d3;
  --dim: #98a39e;
  --faint: #66736f;
  --gold: #f4c53c;
  --gold-deep: #c8961a;
  --gold-ink: #241a02;
  --rival: #e2508a;
  --rival-deep: #a72b5e;
  --agar: #b9a77e;
  --ok: #9ad17f;
  --bad: #f06a5f;
  --f-display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bench); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 12px; box-sizing: border-box; }
.bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.logo { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: -0.03em; color: var(--gold); line-height: 1; }
.logo span { color: var(--rival); }
.tagline { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
.progress { font-family: var(--f-mono); font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.progress .dots { display: flex; gap: 4px; }
.progress .dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
.progress .dots i.on { background: var(--gold); border-color: var(--gold); }

.main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.stage { position: relative; flex: none; height: 40%; min-height: 220px; border-radius: var(--r-lg); overflow: hidden; background: radial-gradient(120% 90% at 50% 38%, #24302f 0%, #141c1e 48%, #0b1012 100%); box-shadow: inset 0 0 0 1px var(--line); touch-action: none; }
.stage canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.panel { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; border-radius: var(--r-lg); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
#app.mode-battle .stage { flex: 1; height: auto; }
#app.mode-battle .panel { display: none; }
@media (min-width: 880px) {
  .main { flex-direction: row-reverse; }
  .stage { flex: 1; height: auto; }
  .panel { flex: none; width: 420px; }
}

/* ---------- Rack ---------- */
.pad { padding: 18px 18px 22px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.rack h1 { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -0.02em; margin-top: 6px; }
.rack .lede { color: var(--dim); margin: 8px 0 16px; max-width: 62ch; }
.dishes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.dish { width: 100%; display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 10px 12px 10px 10px; border-radius: var(--r-md); background: var(--raised); border: 1px solid var(--line); cursor: pointer; min-height: 72px; }
.dish:hover:not(:disabled) { background: var(--raised-2); }
.dish:disabled { cursor: not-allowed; opacity: 0.5; }
.dish.sel { border-color: var(--gold); }
.dish canvas { width: 56px; height: 56px; border-radius: 50%; display: block; }
.dish .meta { min-width: 0; display: grid; gap: 2px; }
.dish .code { font-family: var(--f-mono); font-size: 11px; color: var(--faint); letter-spacing: 0.08em; }
.dish b { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.15; }
.dish .rv { color: var(--dim); font-size: 12.5px; font-style: italic; }
.chip { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.chip.won { color: var(--gold-ink); background: var(--gold); border-color: var(--gold); }
.chip.ready { color: var(--gold); border-color: var(--gold-deep); }
.howto { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.howto summary { cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 16px; list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
.howto summary::after { content: "+"; font-family: var(--f-mono); color: var(--faint); }
.howto[open] summary::after { content: "–"; }
.howto ol { margin: 10px 0 0; padding-left: 20px; color: var(--dim); display: grid; gap: 6px; max-width: 62ch; }
.howto b { color: var(--ink); font-weight: 600; }
.linkbtn { background: none; border: 0; padding: 8px 0; color: var(--faint); font-family: var(--f-mono); font-size: 11.5px; text-decoration: underline; cursor: pointer; margin-top: 14px; }

/* ---------- Lab ---------- */
.lab { display: flex; flex-direction: column; min-height: 100%; }
.lab-body { padding: 14px 18px 8px; display: grid; gap: 18px; }
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 0; color: var(--dim); cursor: pointer; font-size: 13px; min-height: 36px; }
.lab-title { display: grid; gap: 4px; }
.lab-title h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1.05; letter-spacing: -0.02em; }
.lab-title p { margin: 2px 0 0; color: var(--dim); max-width: 62ch; }
.intel { display: grid; gap: 10px; padding: 12px; border-radius: var(--r-md); background: var(--bench-2); border: 1px solid var(--line); }
.intel .row { display: grid; gap: 6px; }
.intel .lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 9px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); }
.tag .sw { width: 9px; height: 9px; border-radius: 3px; }
.tag.yes { border-color: #4a6b3c; }
.tag.no { border-color: #6b3b38; }
.tag .mk { font-family: var(--f-mono); font-size: 11px; }
.tag.yes .mk { color: var(--ok); } .tag.no .mk { color: var(--bad); }
.rival-name { font-family: var(--f-display); font-weight: 700; font-size: 16px; color: var(--rival); font-style: italic; }
.rival-stats { font-family: var(--f-mono); font-size: 11.5px; color: var(--dim); }
.sec { display: grid; gap: 10px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-h h3 { font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.sec-h small { color: var(--faint); font-size: 12px; }
.name-in { width: 100%; box-sizing: border-box; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-sm); color: var(--ink); padding: 10px 12px; font-family: var(--f-display); font-weight: 700; font-size: 17px; min-height: 44px; }
.trait { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border-radius: var(--r-md); background: var(--raised); border: 1px solid var(--line); }
.trait .tn { font-weight: 600; }
.trait .td { grid-column: 1 / -1; color: var(--dim); font-size: 12.5px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; background: var(--raised-2); border: 1px solid var(--line); cursor: pointer; font-size: 18px; line-height: 1; }
.stepper button:disabled { opacity: 0.35; cursor: not-allowed; }
.pips { display: flex; gap: 3px; padding: 0 6px; }
.pips i { width: 8px; height: 18px; border-radius: 3px; background: var(--raised-2); }
.pips i.on { background: var(--gold); }
.cost { font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.derived { font-family: var(--f-mono); font-size: 11.5px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; }
.derived b { color: var(--ink); font-weight: 500; }
.slider { display: grid; grid-template-columns: 92px 1fr 26px; align-items: center; gap: 10px; min-height: 40px; }
.slider label { font-size: 13px; }
.slider output { font-family: var(--f-mono); font-size: 12px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--raised-2); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--raised-2); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); margin-top: -8px; border: 3px solid var(--panel); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--gold); border: 3px solid var(--panel); }
.genes { display: grid; gap: 6px; }
.gene { display: grid; grid-template-columns: 30px 1fr auto; gap: 2px 10px; align-items: center; text-align: left; width: 100%; padding: 10px 12px 10px 10px; border-radius: var(--r-md); background: var(--raised); border: 1px solid var(--line); cursor: pointer; min-height: 56px; }
.gene .glyph { grid-row: 1 / 3; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.gene .glyph svg { width: 16px; height: 16px; }
.gene .gn { font-weight: 600; }
.gene .gc { font-family: var(--f-mono); font-size: 11px; color: var(--dim); }
.gene .gd { grid-column: 2 / 4; color: var(--dim); font-size: 12.5px; }
.gene[aria-pressed="true"] { background: #2b2a17; border-color: var(--gold-deep); }
.gene[aria-pressed="true"] .glyph { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.gene[aria-pressed="true"] .gc { color: var(--gold); }
.gene.locked { cursor: not-allowed; opacity: 0.45; }
.gene.locked .gd { font-style: italic; }
.gene.cant:not([aria-pressed="true"]) { opacity: 0.7; }
.lab-foot { position: sticky; bottom: 0; margin-top: auto; background: linear-gradient(to top, var(--panel) 75%, transparent); padding: 18px 18px 14px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.budget { display: grid; gap: 6px; }
.budget .bl { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.budget .bl b { color: var(--ink); font-weight: 500; }
.budget.over .bl b { color: var(--bad); }
.meter { height: 8px; border-radius: 4px; background: var(--raised-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--gold); border-radius: 4px; transition: width .2s; }
.budget.over .meter i { background: var(--bad); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: var(--r-md); background: var(--raised-2); border: 1px solid var(--line); cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-family: var(--f-display); font-weight: 800; font-size: 16px; letter-spacing: 0.01em; }
.btn.primary:disabled { background: var(--raised-2); border-color: var(--line); color: var(--faint); cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }

/* ---------- Battle HUD ---------- */
.hud { position: absolute; left: 0; right: 0; top: 0; padding: 10px 12px 26px; background: linear-gradient(to bottom, rgba(8,12,13,.85), rgba(8,12,13,0)); pointer-events: none; display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px 10px; align-items: start; }
.hud .side { min-width: 0; display: grid; gap: 1px; }
.hud .side.e { text-align: right; }
.hud .sname { font-family: var(--f-display); font-weight: 700; font-size: 15px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud .side.p .sname { color: var(--gold); } .hud .side.e .sname { color: var(--rival); font-style: italic; }
.hud .nums { font-family: var(--f-mono); font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hud .nums b { color: var(--ink); font-weight: 500; }
.hud .clock { text-align: center; display: grid; }
.hud .clock span { font-family: var(--f-mono); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.hud .clock small { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
.tug { grid-column: 1 / -1; height: 6px; border-radius: 3px; overflow: hidden; display: flex; background: var(--raised-2); }
.tug i { display: block; height: 100%; transition: width .15s linear; }
.tug .tp { background: var(--gold); } .tug .te { background: var(--rival); margin-left: auto; }
.toast { position: absolute; left: 50%; top: 78px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 7px 12px; border-radius: 999px; background: rgba(13,18,20,.88); border: 1px solid var(--line); font-size: 13px; display: flex; gap: 8px; align-items: center; pointer-events: none; transition: opacity .3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast .tt { font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.toast .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font-family: var(--f-mono); font-size: 11px; color: var(--faint); pointer-events: none; transition: opacity .6s; white-space: nowrap; }
.inspect { position: absolute; left: 12px; bottom: 12px; width: min(270px, calc(100% - 24px)); padding: 12px 14px; border-radius: var(--r-md); background: rgba(16,22,24,.94); border: 1px solid var(--line); display: grid; gap: 6px; font-size: 13px; }
.inspect header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.inspect header b { font-family: var(--f-display); font-size: 15px; }
.inspect .x { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; }
.inspect dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
.inspect dt { color: var(--faint); font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; padding-top: 2px; }
.inspect dd { margin: 0; font-variant-numeric: tabular-nums; }
.hpbar { height: 5px; border-radius: 3px; background: var(--raised-2); overflow: hidden; margin-top: 3px; }
.hpbar i { display: block; height: 100%; }
.log { position: absolute; right: 12px; top: 86px; bottom: 12px; width: min(300px, calc(100% - 24px)); border-radius: var(--r-md); background: rgba(16,22,24,.95); border: 1px solid var(--line); display: flex; flex-direction: column; }
.log header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.log header b { font-family: var(--f-display); font-size: 15px; }
.log ol { list-style: none; margin: 0; padding: 4px; overflow-y: auto; flex: 1; }
.log li button { width: 100%; text-align: left; background: none; border: 0; padding: 8px; border-radius: 8px; display: grid; grid-template-columns: 44px 10px 1fr; gap: 8px; align-items: center; cursor: pointer; font-size: 12.5px; }
.log li button:hover, .log li button.cur { background: var(--raised); }
.log .tt { font-family: var(--f-mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.log .dot { width: 8px; height: 8px; border-radius: 50%; }

.result { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(6,9,10,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.card { width: min(440px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; display: grid; gap: 14px; }
.card .verdict { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -0.02em; }
.card .verdict.win { color: var(--gold); } .card .verdict.lose { color: var(--rival); }
.card .why { color: var(--dim); margin-top: 6px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 8px 10px; border-radius: var(--r-sm); background: var(--raised); }
.stat small { display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.stat b { font-family: var(--f-mono); font-weight: 500; font-size: 17px; font-variant-numeric: tabular-nums; }
.stat .vs { color: var(--faint); font-size: 12px; }
.losses .bar2 { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--raised-2); margin: 6px 0; }
.losses .bar2 i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.notes { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink); }
.notes li::marker { color: var(--gold); }
.unlock { padding: 10px 12px; border-radius: var(--r-md); border: 1px dashed var(--gold-deep); color: var(--gold); font-size: 13px; }
.unlock b { color: var(--ink); }
.card .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.card .acts .btn { flex: 1 1 120px; }
.sub-h { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }

/* ---------- Transport ---------- */
.transport { flex: none; display: grid; gap: 8px; }
.scrubwrap { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.scrubwrap .tt { font-family: var(--f-mono); font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 40px; }
.scrubwrap .tt:last-child { text-align: right; }
#scrub { width: 100%; height: 48px; display: block; border-radius: 10px; touch-action: none; cursor: pointer; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.controls { display: flex; align-items: center; gap: 6px; justify-content: center; flex-wrap: wrap; }
.ib { width: 46px; height: 46px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); display: grid; place-items: center; cursor: pointer; padding: 0; }
.ib svg { width: 20px; height: 20px; }
.ib.play { width: 58px; background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.ib.txt { width: auto; padding: 0 12px; font-family: var(--f-mono); font-size: 13px; }
.controls .gap { flex: 1 1 0; max-width: 18px; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--dim); }
@media (max-width: 420px) {
  .ib { width: 40px; height: 42px; border-radius: 10px; } .ib.play { width: 48px; } .ib.txt { padding: 0 8px; min-width: 40px; }
  .controls { gap: 3px; flex-wrap: nowrap; }
  .controls .gap { display: none; }
  .hud .sname { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { .meter i, .tug i, .toast, .hint { transition: none; } }
</style>

<div id="app" class="mode-rack">
  <header class="bar">
    <div class="brand"><div class="logo">MYX<span>O</span></div><div class="tagline">petri wars</div></div>
    <div class="progress" id="progress"></div>
  </header>
  <main class="main">
    <section class="stage" id="stage" aria-label="Petri dish view">

<script>
// ===================== MYXO SIMULATION =====================
// Deterministic cellular battle between two plasmodia on a petri dish.
const N = 52, NN = N * N, MAXT = 720;
const CXf = (N - 1) / 2, DISH_R = N / 2 - 1.0;
const T_VOID = 0, T_AGAR = 1, T_ROCK = 2, T_SALT = 3, T_LIGHT = 4;
const F_NONE = 0, F_SUGAR = 1, F_PROT = 2, F_LIGN = 3;
const S_NONE = 0, S_ENGULF = 1, S_ACID = 2, S_TOXIN = 3, S_SALT = 4, S_UV = 5, S_STARVE = 6, S_SEVER = 7;
const SRC_NAMES = ['—', 'Engulfed', 'Acid', 'Antibiotic', 'Salt', 'UV glare', 'Starvation', 'Severed'];
const FOOD_NAMES = ['', 'Oat flakes', 'Bacterial lawn', 'Bark chips'];
const ROCK_HP = 14;
const EAT_RATE = [0, 0.5, 0.5, 0.22];
const YIELD = [0, 1.0, 1.25, 2.6];

const DX = [1, -1, 0, 0, 1, 1, -1, -1], DY = [0, 0, 1, -1, 1, -1, 1, -1];
const NB = new Int32Array(NN * 8).fill(-1);
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  const i = y * N + x;
  for (let k = 0; k < 8; k++) {
    const nx = x + DX[k], ny = y + DY[k];
    if (nx >= 0 && ny >= 0 && nx < N && ny < N) NB[i * 8 + k] = ny * N + nx;
  }
}

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------- Genes ----------------
const GENES = [
  { id: 'amylase', cat: 'Metabolism', name: 'Amylase', cost: 1, unlock: 0, desc: 'Digests oat flakes. The staple diet.' },
  { id: 'protease', cat: 'Metabolism', name: 'Protease', cost: 1, unlock: 0, desc: 'Digests bacterial lawns. Richer than oats.' },
  { id: 'ligninase', cat: 'Metabolism', name: 'Ligninase', cost: 2, unlock: 3, desc: 'Digests bark chips. Slow to break down, very rich.' },

  { id: 'sclero', cat: 'Defense', name: 'Sclerotia', cost: 2, unlock: 4, desc: 'When starving, hardens and sleeps instead of dying. Sleeping cells take 60% less damage.' },
  { id: 'regen', cat: 'Defense', name: 'Cytoplasmic Healing', cost: 2, unlock: 0, desc: 'Connected cells heal quickly between fights.' },
  { id: 'crush', cat: 'Offense', name: 'Pseudopod Crush', cost: 2, unlock: 0, desc: '+60% engulfing damage on contact.' },

  { id: 'spores', cat: 'Offense', name: 'Spore Cannons', cost: 3, unlock: 6, desc: 'Every 45 min fires spores at distant food. Sporelings become new nuclei.' },
  { id: 'prune', cat: 'Network', name: 'Vein Pruning', cost: 1, unlock: 0, desc: 'Retracts idle tubes into a lean network. Refunds energy, lowers upkeep.' },
  { id: 'fragment', cat: 'Network', name: 'Autonomy', cost: 2, unlock: 5, desc: 'Severed fragments survive and keep feeding.' },
];
const GENE_BY_ID = Object.fromEntries(GENES.map(g => [g.id, g]));
const TRAIT_COST = [0, 0, 1, 2, 4, 6]; // index by level 1..5

function genomeCost(g) {
  let c = TRAIT_COST[g.vigor] + TRAIT_COST[g.density];
  for (const id of g.genes) c += GENE_BY_ID[id] ? GENE_BY_ID[id].cost : 0;
  return c;
}

function deriveSide(g) {
  const G = new Set(g.genes);
  const has = id => G.has(id);
  const v = g.vigor, d = g.density;
  let tf = g.taxis.food, th = g.taxis.hunt, tw = g.taxis.wander;
  let sum = tf + th + tw; if (sum <= 0) { tw = 1; sum = 1; }
  let costly = 0; for (const id of g.genes) if (GENE_BY_ID[id] && GENE_BY_ID[id].cost >= 2) costly++;
  return {
    g, has, vigor: v, density: d,
    acid: has('acid'), chitin: has('chitin'), mucus: has('mucus'), osmo: has('osmo'), sclero: has('sclero'),
    regen: has('regen'), toxin: has('toxin'), spores: has('spores'), prune: has('prune'), fragment: has('fragment'),
    chloro: has('chloro'), necro: has('necro'),
    eat: [false, has('amylase'), has('protease'), has('ligninase')],
    maxHP: 12 + d * 6,
    growCost: (1.0 + d * 0.5) * (has('chitin') ? 1.15 : 1),
    engulf: (0.8 + d * 0.4) * (has('crush') ? 1.6 : 1),
    k0: 0.4 + v * 0.45, k1: 0.035 * v,
    upkeep: Math.max(0.002, 0.0035 + d * 0.0018 + v * 0.0016 + costly * 0.0004 - (has('prune') ? 0.0012 : 0)),
    wF: tf / sum, wH: th / sum, wW: tw / sum,
  };
}

// ---------------- Levels ----------------
const LEVELS = [
  {
    name: 'Oat Flake Plate', code: 'D-01', seed: 101, budget: 8,
    blurb: 'Plain 2% agar scattered with rolled oats. A gentle first culture.',

    gen(D, r) {

      D.pile(F_PROT, 21, 8, 1.5, 90); D.pile(F_SUGAR, 20, 27, 1.3, 70);
      D.pile(F_SUGAR, 29, 14, 1.6, 90); D.pile(F_PROT, 9, 37, 1.3, 70);
    }
  },
  {
    name: 'Granite Maze', code: 'D-02', seed: 202, budget: 10,
    blurb: 'Crushed granite walls split the plate. Bark chips sit sealed in the centre ring.',
    rival: { name: 'Lycogala corrodens', vigor: 2, density: 2, genes: ['amylase', 'acid', 'ligninase'], taxis: { food: 6, hunt: 5, wander: 2 } },
    gen(D, r) {
      D.line(14, 12, 14, 40, 0.9, D.rock);
      D.ring(CXf, CXf, 7.5, 1.0, [0.6, 2.2, 3.7, 5.3], D.rock);
      D.pile(F_LIGN, CXf, CXf, 2.6, 120);
      D.pile(F_SUGAR, 9, 18, 1.4, 70);
      D.pile(F_SUGAR, 20, 8, 1.6, 90); D.pile(F_SUGAR, 21, 43, 1.6, 90);
      D.pile(F_PROT, 23, 31, 1.3, 70);
    }
  },
  {
    name: 'Salt Pan', code: 'D-03', seed: 303, budget: 12,
    blurb: 'Brine has dried into crusts. The best food lies inside the salt.',
    rival: { name: 'Stemonitis lorica', vigor: 2, density: 3, genes: ['amylase', 'protease', 'ligninase', 'chitin', 'osmo', 'regen', 'prune'], taxis: { food: 7, hunt: 3, wander: 2 } },
    gen(D, r) {
      D.line(17, 3, 21, 48, 2.6, D.salt);
      D.disc(CXf, CXf, 6.5, D.salt);
      D.pile(F_LIGN, CXf, CXf, 2.2, 120);
      D.pile(F_SUGAR, 19, 15, 1.6, 100); D.pile(F_SUGAR, 20, 36, 1.6, 100);
      D.pile(F_SUGAR, 10, 15, 1.2, 60);
      D.pile(F_PROT, 27, 9, 1.4, 80);
    }
  },
  {
    name: 'Sunlit Shallows', code: 'D-04', seed: 404, budget: 13,
    blurb: 'A thin film of agar under a lamp. Little food, lots of light, harsh UV.',
    rival: { name: 'Ceratiomyxa lumina', vigor: 3, density: 3, genes: ['chloro', 'amylase', 'sclero', 'prune'], taxis: { food: 6, hunt: 3, wander: 3 } },
    gen(D, r) {
      D.light(CXf, CXf, 6.5); D.light(15, 12, 4.5); D.light(15, 40, 4.0);
      D.pile(F_SUGAR, 12, 30, 1.1, 50); D.pile(F_SUGAR, 22, 18, 1.1, 50);
      D.pile(F_LIGN, 15, 12, 1.3, 70);
      D.rock(19, 26, 1.2); D.rock(28, 8, 1.3);
    }
  },
  {
    name: 'Bacterial Bloom', code: 'D-05', seed: 505, budget: 15,
    blurb: 'A lawn of bacteria has bloomed overnight. Your rival is fast and hungry.',
    rival: { name: 'Badhamia vorax', vigor: 4, density: 2, genes: ['protease', 'amylase', 'acid', 'crush'], taxis: { food: 5, hunt: 7, wander: 1 } },
    gen(D, r) {
      const spots = [[13, 14], [19, 21], [12, 33], [21, 37], [24, 10], [16, 44], [26, 27], [10, 22]];
      for (const [x, y] of spots) D.pile(F_PROT, x, y, 1.3 + r() * 0.5, 80 + r() * 40);
      D.pile(F_SUGAR, CXf, CXf, 2.0, 90);
      D.salt(19, 29, 1.5); D.rock(22, 16, 1.0);
    }
  },
  {
    name: 'The Elder Plasmodium', code: 'D-06', seed: 606, budget: 17,
    blurb: 'An ancient strain holds this plate. Granite, brine and light, all at once.',
    rival: { name: 'Physarum senex', vigor: 3, density: 3, genes: ['amylase', 'protease', 'ligninase', 'acid', 'mucus', 'chitin', 'regen', 'osmo', 'prune', 'chloro'], taxis: { food: 6, hunt: 5, wander: 1 } },
    gen(D, r) {
      D.ring(CXf, CXf, 8.0, 1.0, [1.2, 2.8, 4.4, 6.0], D.rock);
      D.light(CXf, CXf, 5.0);
      D.pile(F_LIGN, CXf, CXf, 2.2, 130);
      D.line(15, 6, 18, 18, 1.6, D.salt);
      D.pile(F_PROT, 17, 12, 1.3, 90);
      D.pile(F_SUGAR, 13, 36, 1.6, 90); D.pile(F_PROT, 22, 42, 1.4, 90);
      D.pile(F_SUGAR, 25, 7, 1.4, 80);
      D.rock(13, 28, 1.0);
    }
  },
];

const CORE_P = 25 * N + 7, CORE_E = NN - 1 - CORE_P;

function makeDish(levelIdx) {
  const L = LEVELS[levelIdx];
  const r = rng(L.seed);
  const terrain = new Uint8Array(NN), foodType = new Uint8Array(NN), food0 = new Float32Array(NN);
  const pile = new Int16Array(NN).fill(-1), rockHP = new Float32Array(NN);
  const piles = [], lights = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const dx = x - CXf, dy = y - CXf;
    terrain[y * N + x] = (dx * dx + dy * dy <= DISH_R * DISH_R) ? T_AGAR : T_VOID;
  }
  const isCenter = (x, y) => Math.abs(x - CXf) < 0.01 && Math.abs(y - CXf) < 0.01;
  function cells(cx, cy, rad, fn) {
    const out = [];
    for (let y = Math.floor(cy - rad - 1); y <= cy + rad + 1; y++) for (let x = Math.floor(cx - rad - 1); x <= cx + rad + 1; x++) {
      if (x < 0 || y < 0 || x >= N || y >= N) continue;
      const d = Math.hypot(x - cx, y - cy);
      if (d <= rad) { const i = y * N + x; if (terrain[i] !== T_VOID) out.push([i, d / Math.max(rad, 0.01)]); }
    }
    return out;
  }
  const D = {
    rock(cx, cy, rad) {
      for (const [i] of cells(cx, cy, rad)) for (const j of [i, NN - 1 - i]) {
        if (terrain[j] === T_VOID) continue;
        terrain[j] = T_ROCK; rockHP[j] = ROCK_HP; foodType[j] = 0; food0[j] = 0; pile[j] = -1;
      }
    },
    salt(cx, cy, rad) {
      for (const [i] of cells(cx, cy, rad)) for (const j of [i, NN - 1 - i]) if (terrain[j] === T_AGAR || terrain[j] === T_LIGHT) terrain[j] = T_SALT;
    },
    light(cx, cy, rad) {
      for (const [i] of cells(cx, cy, rad)) for (const j of [i, NN - 1 - i]) if (terrain[j] === T_AGAR) terrain[j] = T_LIGHT;
      lights.push({ x: cx, y: cy, r: rad });
      if (!isCenter(cx, cy)) lights.push({ x: N - 1 - cx, y: N - 1 - cy, r: rad });
    },
    disc(cx, cy, rad, fn) { fn(cx, cy, rad); },
    line(x0, y0, x1, y1, w, fn) {
      const len = Math.hypot(x1 - x0, y1 - y0), steps = Math.ceil(len * 2);
      for (let s = 0; s <= steps; s++) { const t = s / steps; fn(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, w); }
    },
    ring(cx, cy, rad, w, gaps, fn) {
      const steps = Math.ceil(rad * Math.PI * 4);
      for (let s = 0; s < steps; s++) {
        const a = s / steps * Math.PI * 2;
        if (gaps.some(g => Math.abs(((a - g + Math.PI * 3) % (Math.PI * 2)) - Math.PI) < 0.32)) continue;
        fn(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, w);
      }
    },
    pile(type, cx, cy, rad, amt) {
      const variants = isCenter(cx, cy) ? [false] : [false, true];
      for (const mir of variants) {
        const id = piles.length, list = [];
        const px = mir ? N - 1 - cx : cx, py = mir ? N - 1 - cy : cy;
        for (const [i, d] of cells(px, py, rad)) {
          if (terrain[i] === T_ROCK) continue;
          foodType[i] = type; food0[i] = 1.8 * amt * (0.55 + 0.45 * (1 - d)); pile[i] = id; list.push(i);
        }
        piles.push({ type, x: px, y: py, cells: list });
      }
    },
  };
  L.gen(D, r);
  for (const c of [CORE_P, CORE_E]) {
    const cx = c % N, cy = Math.floor(c / N);
    for (const [i] of cells(cx, cy, 3.6)) { terrain[i] = T_AGAR; foodType[i] = 0; food0[i] = 0; pile[i] = -1; rockHP[i] = 0; }
  }
  return { terrain, foodType, food0, pile, rockHP, piles, lights, level: levelIdx };
}

// ---------------- Battle ----------------
function Battle(levelIdx, genomeP, genomeE) {
  const dish = makeDish(levelIdx);
  this.dish = dish; this.level = levelIdx;
  this.terrain = dish.terrain.slice();
  this.food = dish.food0.slice();
  this.rockHP = dish.rockHP.slice();
  this.owner = new Uint8Array(NN);
  this.hp = new Float32Array(NN);
  this.dorm = new Uint8Array(NN);
  this.dist = [null, new Int16Array(NN), new Int16Array(NN)];
  this.fd = [null, new Uint16Array(NN), new Uint16Array(NN)];
  this.ed = [null, new Uint16Array(NN), new Uint16Array(NN)];
  this.dmg = new Float32Array(NN); this.dsrc = new Uint8Array(NN); this.dsrcAmt = new Float32Array(NN);
  this.dby = new Uint8Array(NN);
  this.queue = new Int32Array(NN);
  this.stamp = new Int32Array(NN); this.stampId = 1;
  this.tmpA = new Uint8Array(NN); this.tmpB = new Uint8Array(NN);
  this.candJ = new Int32Array(NN); this.candS = new Float32Array(NN);
  this.rnd = rng(9001 + levelIdx * 131);
  const mk = (g, core) => {
    const s = deriveSide(g);
    Object.assign(s, {
      energy: 100, roots: [core], core, cells: 0, connected: 0, alive: true, growAcc: 0,
      starving: false, starveTicks: 0, dmgTaken: new Float32Array(8), lost: new Int32Array(8),
      kills: 0, eaten: 0, peak: 0, coreLost: -1, pilesSeen: new Set(), lastBreach: -99, lastSever: -99, wasDormant: false,
      prevDisc: 0, spent: 0,
    });
    return s;
  };
  this.sides = [null, mk(genomeP, CORE_P), mk(genomeE, CORE_E)];
  for (const s of [1, 2]) {
    const S = this.sides[s];
    const c = S.core;
    this.setCell(c, s, S.maxHP);
    for (let k = 0; k < 8; k++) { const j = NB[c * 8 + k]; if (j >= 0 && this.passable(j, S)) this.setCell(j, s, S.maxHP); }
  }
  this.tick = 0; this.done = false; this.result = null;
  this.frames = []; this.events = [];
  this.stats = { cells: [null, [], []], energy: [null, [], []] };
  this.contact = false;
  this.connect(1); this.connect(2);
  this.scent(1); this.scent(2);
  this.count();
  this.record();
}

Battle.prototype.setCell = function (i, s, hp) { this.owner[i] = s; this.hp[i] = hp; this.dorm[i] = 0; };
Battle.prototype.passable = function (i, S) {
  const t = this.terrain[i];
  return t !== T_VOID && t !== T_ROCK;
};
Battle.prototype.event = function (side, type, cell, extra) {
  this.events.push(Object.assign({ t: this.tick, side, type, cell }, extra || {}));
};

Battle.prototype.connect = function (s) {
  const S = this.sides[s], dist = this.dist[s], owner = this.owner, q = this.queue;
  dist.fill(-1);
  S.roots = S.roots.filter(r => owner[r] === s);
  let h = 0, t = 0;
  for (const r of S.roots) { dist[r] = 0; q[t++] = r; }
  while (h < t) {
    const i = q[h++], d = dist[i] + 1;
    for (let k = 0; k < 8; k++) {
      const j = NB[i * 8 + k];
      if (j < 0 || owner[j] !== s || dist[j] >= 0) continue;
      dist[j] = d; q[t++] = j;
    }
  }
  S.connected = t;
};

Battle.prototype.bfsFrom = function (out, isSource, canPass) {
  const q = this.queue; let h = 0, t = 0;
  out.fill(65535);
  for (let i = 0; i < NN; i++) if (isSource(i)) { out[i] = 0; q[t++] = i; }
  while (h < t) {
    const i = q[h++], d = out[i] + 1;
    for (let k = 0; k < 8; k++) {
      const j = NB[i * 8 + k];
      if (j < 0 || out[j] !== 65535 || !canPass(j)) continue;
      out[j] = d; q[t++] = j;
    }
  }
};

Battle.prototype.scent = function (s) {
  const S = this.sides[s], o = 3 - s, terr = this.terrain, food = this.food, ft = this.dish.foodType, owner = this.owner;
  const canPass = j => { const t = terr[j]; return t !== T_VOID && (t !== T_ROCK || S.acid); };

Battle.prototype.grow = function (s) {

Battle.prototype.sporulate = function (s) {

  sg.beginPath(); sg.moveTo(X(0), bot);
  for (let t = 0; t < n; t++) { const p = b.stats.cells[1][t], e = b.stats.cells[2][t]; sg.lineTo(X(t), bot - H * (p / Math.max(p + e, 1))); }
  sg.lineTo(X(n - 1), bot); sg.closePath(); sg.fillStyle = 'rgba(244,197,60,0.55)'; sg.fill();
  sg.beginPath(); sg.moveTo(X(0), top);
  for (let t = 0; t < n; t++) { const p = b.stats.cells[1][t], e = b.stats.cells[2][t]; sg.lineTo(X(t), bot - H * (p / Math.max(p + e, 1))); }
  sg.lineTo(X(n - 1), top); sg.closePath(); sg.fillStyle = 'rgba(226,80,138,0.45)'; sg.fill();
  sg.strokeStyle = 'rgba(255,255,255,0.15)'; sg.lineWidth = 1; sg.beginPath(); sg.moveTo(X(0), top + H / 2); sg.lineTo(X(total), top + H / 2); sg.stroke();
  // hour ticks
  sg.fillStyle = 'rgba(255,255,255,0.18)';
  for (let hr = 1; hr * 60 < total; hr++) sg.fillRect(Math.round(X(hr * 60)), bot - 3, 1, 3);
  // events
  for (const ev of b.events) {
    sg.fillStyle = evColor(ev);
    const big = ev.type === 'core' || ev.type === 'end' || ev.type === 'contact';
    sg.beginPath(); sg.arc(X(ev.t), 5, big ? 3.2 : 2, 0, Math.PI * 2); sg.fill();
  }
  // playhead
  const px = X(S.playhead);
  sg.fillStyle = '#ece5d3'; sg.fillRect(px - 1, 2, 2, h - 4);
  sg.beginPath(); sg.arc(px, h / 2, 5, 0, Math.PI * 2); sg.fill();
}
function scrubAt(clientX) {
  const b = S.battle, r = scrub.getBoundingClientRect();
  const total = b.done ? b.frames.length - 1 : MAXT;
  const t = clamp((clientX - r.left - 6) / (r.width - 12), 0, 1) * total;
  seek(t);
}
scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); scrubDrag = { was: S.playing }; S.playing = false; setPlayIcon(); scrubAt(e.clientX); });
scrub.addEventListener('pointermove', e => { if (scrubDrag) scrubAt(e.clientX); });
const endScrub = () => { if (scrubDrag) { S.playing = scrubDrag.was && S.playhead < lastTick(); scrubDrag = null; setPlayIcon(); } };
scrub.addEventListener('pointerup', endScrub); scrub.addEventListener('pointercancel', endScrub);

// --- transport buttons ---
function togglePlay() {
  if (!S.battle) return;
  if (!S.playing && S.battle.done && S.playhead >= lastTick() - 0.01) seek(0);
  S.playing = !S.playing; setPlayIcon();
}
function stepBy(d) { if (!S.battle) return; S.playing = false; setPlayIcon(); const t = Math.round(S.playhead) + d; seek(t, d > 0); }
function jumpEvent(dir) {
  if (!S.battle) return;
  S.playing = false; setPlayIcon();
  const evs = S.battle.events, t = Math.round(S.playhead);
  const ev = dir > 0 ? evs.find(e => e.t > t) : [...evs].reverse().find(e => e.t < t);
  if (ev) { seek(ev.t); fireEvents(ev.t - 1, ev.t); if (ev.cell >= 0 && ev.type !== 'end') selectCell(ev.cell); }
  else if (dir < 0) seek(0); else seek(lastTick());
}
$('bPlay').addEventListener('click', togglePlay);
$('bBack').addEventListener('click', () => stepBy(-1));
$('bFwd').addEventListener('click', () => stepBy(1));
$('bPrevEv').addEventListener('click', () => jumpEvent(-1));
$('bNextEv').addEventListener('click', () => jumpEvent(1));
$('bSpeed').addEventListener('click', () => { const k = (SPEEDS.indexOf(S.speed) + 1) % SPEEDS.length; S.speed = SPEEDS[k]; $('bSpeed').textContent = (S.speed < 1 ? (S.speed === 0.5 ? '½' : '¼') : S.speed) + '×'; });
$('bLog').addEventListener('click', () => { $('log').hidden = !$('log').hidden; });
$('logX').addEventListener('click', () => { $('log').hidden = true; });
$('bLab').addEventListener('click', () => { S.playing = false; openLab(S.level); });
document.addEventListener('keydown', e => {
  if (S.mode !== 'battle' || e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stepBy(e.shiftKey ? -10 : -1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stepBy(e.shiftKey ? 10 : 1); }
  else if (e.key === '[') jumpEvent(-1); else if (e.key === ']') jumpEvent(1);
});

// --- inspector ---
function selectCell(i) {
  S.sel = i;
  surfUniforms.uSel.value.set(0, 0, 0);
  if (i < 0) { $('inspect').hidden = true; return; }
  surfUniforms.uSel.value.set(((i % N) + 0.5) / N, (Math.floor(i / N) + 0.5) / N, 1);
  $('inspect').hidden = false; S.inspT = -1; hideHint(); updateInspect();
}
const TERR_NAMES = ['', 'Agar', 'Granite', 'Salt crust', 'Sunlit agar'];
function updateInspect() {
  if (S.sel < 0 || !S.battle) return;
  const b = S.battle, t = clamp(Math.floor(S.playhead), 0, lastTick());
  if (S.inspT === t) return; S.inspT = t;
  const F = b.frames[t], i = S.sel, f = F.flags[i], o = f & 3;
  let terr = TERR_NAMES[b.dish.terrain[i]];
  if (b.dish.terrain[i] === T_ROCK) terr = F.matter[i] > 0 ? `Granite · ${Math.round(F.matter[i] / 255 * 100)}% intact` : 'Granite (dissolved)';
  const food = b.dish.food0[i] > 0 ? `${FOOD_NAMES[b.dish.foodType[i]]} · ${Math.round(F.matter[i] / 255 * 100)}% left` : 'None';
  let occ = '<dd>Empty agar</dd>';
  if (o) {
    const Sd = b.sides[o], v = F.dens[i * 4 + o - 1] / 255, hpv = Math.max(0, (v - 0.3) / 0.7) * Sd.maxHP;
    const status = [(f & 4) ? 'dormant' : '', (f & 8) ? 'severed' : '', i === Sd.core ? 'main nucleus' : ''].filter(Boolean).join(', ');
    occ = `<dd><span style="color:${o === 1 ? COL.p : COL.e};font-weight:600">${esc(sideName(o))}</span>${status ? ' · ' + status : ''}<div>${hpv.toFixed(1)} / ${Sd.maxHP} HP</div><div class="hpbar"><i style="width:${hpv / Sd.maxHP * 100}%;background:${o === 1 ? COL.p : COL.e}"></i></div></dd>`;
  }
  const src = f >> 4, dm = F.dens[i * 4 + 3] / 70;
  const hurt = src ? `<dt>This minute</dt><dd><span style="color:${SRC_COL[src]}">●</span> ${SRC_NAMES[src]} · −${dm.toFixed(1)} HP</dd>` : '';
  $('inspect').innerHTML = `<header><b>Cell ${i % N}, ${Math.floor(i / N)} <span class="tt" style="font-family:var(--f-mono);font-size:11px;color:var(--faint);font-weight:400">at ${fmt(t)}</span></b><button class="x" id="inspX" aria-label="Close inspector">✕</button></header>
    <dl><dt>Ground</dt><dd>${terr}</dd><dt>Food</dt><dd>${food}</dd><dt>Occupant</dt>${occ}${hurt}</dl>`;
  $('inspX').addEventListener('click', () => selectCell(-1));
}

// --- result ---
function analyze(b) {
  const P = b.sides[1], E = b.sides[2], g = P.g, notes = [], has = id => g.genes.includes(id);
  const iso = id => isolated(GENE_BY_ID[id]);
  const dmgTot = P.dmgTaken.reduce((a, x) => a + x, 0) || 1;
  const share = k => P.dmgTaken[k] / dmgTot;
  const uneaten = [0, 0, 0, 0];
  for (let i = 0; i < NN; i++) if (b.dish.food0[i] > 0 && !P.eat[b.dish.foodType[i]]) uneaten[b.dish.foodType[i]] += b.dish.food0[i];
  for (const f of [3, 2, 1]) if (uneaten[f] > 250) {
    const G = GENE_BY_ID[FOOD_ENZ[f]];
    notes.push(`${FOOD_NAMES[f]} sat untouched: about ${Math.round(uneaten[f] * YIELD[f])} ATP your strain couldn’t digest. ${iso(G.id) ? G.name + ' would unlock it.' : 'You’ll need an enzyme you haven’t isolated yet.'}`);
  }
  if (P.starveTicks > 30) notes.push(`Your strain starved for ${P.starveTicks} min. It grew faster than it could feed: lower Vigor or Density, add Vein Pruning, or raise Seek food.`);
  if (share(S_ACID) > 0.3 && !has('mucus')) notes.push(`Acid did ${Math.round(share(S_ACID) * 100)}% of your damage. ${iso('mucus') ? 'Alkaline Slime neutralises most of it.' : 'A slime gene against acid is coming.'}`);
  if (share(S_ENGULF) > 0.45 && !has('chitin') && P.lost[S_ENGULF] > 40) notes.push(`Engulfing did ${Math.round(share(S_ENGULF) * 100)}% of your damage. Chitin Rind halves it; more Density makes cells tougher.`);
  if (share(S_TOXIN) > 0.2 && !has('mucus')) notes.push('The rival’s antibiotic haze ate your front line. Alkaline Slime blunts it.');
  if (P.lost[S_SALT] > 15 && !has('osmo')) notes.push(`${P.lost[S_SALT]} cells died on salt crust. ${iso('osmo') ? 'Osmotic Pumps make you immune.' : 'Lower Wander so growth avoids the crust.'}`);
  if (P.lost[S_UV] > 15 && !has('chloro')) notes.push(`${P.lost[S_UV]} cells burned under the lamp. ${iso('chloro') ? 'An Algal Symbiont turns that light into food.' : 'Lower Wander to keep out of the light.'}`);
  if (P.lost[S_SEVER] > 25 && !has('fragment')) notes.push(`${P.lost[S_SEVER]} cells withered after being cut off from a nucleus. A broader front resists being severed${iso('fragment') ? ', and Autonomy keeps fragments alive' : ''}.`);
  const rocks = b.dish.terrain.some(t => t === T_ROCK);
  if (rocks && !has('acid') && b.result.winner !== 1 && E.acid) notes.push(`${LEVELS[b.level].rival.name.split(' ')[0]} burned through granite you had to walk around. ${iso('acid') ? 'Oxalic Acid opens the same shortcuts.' : ''}`);
  if (b.result.winner !== 1 && b.result.reason === 'time') notes.push('Territory decides at 12:00. Raise Hunt rival to press the attack, or Vigor to claim agar sooner.');
  if (b.result.winner === 1 && !notes.length) notes.push(b.result.reason === 'elim' ? `Clean kill at ${fmt(b.result.tick)}. Try a cheaper genome to see how lean a winning strain can be.` : 'You won on territory. A harder-hitting front could finish the rival outright.');
  return notes.slice(0, 3);
}
function showResult() {
  const b = S.battle, P = b.sides[1], E = b.sides[2], win = b.result.winner === 1;
  const rv = LEVELS[b.level].rival.name;
  let newGenes = [];
  if (win && !prog.cleared[b.level]) {
    prog.cleared[b.level] = true; save(); renderProgress();
    newGenes = GENES.filter(G => G.unlock === b.level + 2);
  }
  const why = b.result.reason === 'elim'
    ? (win ? `${rv} was wiped from the plate at ${fmt(b.result.tick)}.` : `${rv} consumed your strain at ${fmt(b.result.tick)}.`)
    : (win ? `You held ${P.cells} cells to ${E.cells} when incubation ended.` : `${rv} held ${E.cells} cells to your ${P.cells} when incubation ended.`);
  const lostTot = P.lost.reduce((a, x) => a + x, 0);
  const lossBar = lostTot ? [1, 2, 3, 4, 5, 6, 7].filter(k => P.lost[k]).map(k => `<i style="width:${P.lost[k] / lostTot * 100}%;background:${SRC_COL[k]}" title="${SRC_NAMES[k]}"></i>`).join('') : '';
  const legend = [1, 2, 3, 4, 5, 6, 7].filter(k => P.lost[k]).map(k => `<span><i style="background:${SRC_COL[k]}"></i>${SRC_NAMES[k]} ${P.lost[k]}</span>`).join('');
  const notes = analyze(b);
  const next = b.level + 1 < LEVELS.length && playable(b.level + 1);
  const R = $('result');
  R.innerHTML = `<div class="card" role="dialog" aria-label="Battle result">
    <div><div class="eyebrow">${LEVELS[b.level].code} · ${esc(LEVELS[b.level].name)}</div><div class="verdict ${win ? 'win' : 'lose'}">${win ? 'Dish conquered' : 'Overrun'}</div><div class="why">${esc(why)}</div></div>
    <div class="stats">
      <div class="stat"><small>Peak cells</small><b>${P.peak}</b> <span class="vs">/ ${E.peak}</span></div>
      <div class="stat"><small>ATP eaten</small><b>${Math.round(P.eaten)}</b> <span class="vs">/ ${Math.round(E.eaten)}</span></div>
      <div class="stat"><small>Kills</small><b>${P.kills}</b> <span class="vs">/ ${E.kills}</span></div>
    </div>
    ${lostTot ? `<div class="losses"><div class="sub-h">Your ${lostTot} lost cells, by cause</div><div class="bar2">${lossBar}</div><div class="legend">${legend}</div></div>` : ''}
    ${newGenes.length ? `<div class="unlock">New genes isolated: <b>${newGenes.map(G => G.name).join(', ')}</b></div>` : ''}
    ${win && b.level === LEVELS.length - 1 ? '<div class="unlock">Every plate on the rack is yours. Try beating each dish with a smaller genome.</div>' : ''}
    <div><div class="sub-h">Field notes</div><ul class="notes">${notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>
    <div class="acts">
      <button class="btn" id="rReplay">Watch replay</button>
      <button class="btn${win && next ? '' : ' primary'}" id="rLab">Revise genome</button>
      ${win && next ? '<button class="btn primary" id="rNext">Next dish</button>' : ''}
    </div></div>`;
  R.hidden = false;
  $('rReplay').addEventListener('click', () => { R.hidden = true; seek(0); S.playing = true; S.resultShown = false; setPlayIcon(); });
  $('rLab').addEventListener('click', () => openLab(b.level));
  if ($('rNext')) $('rNext').addEventListener('click', () => openLab(b.level + 1));
}

// ===================== Loop =====================
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  const time = now / 1000;
  surfUniforms.uTime.value = time; beamMat.uniforms.uTime.value = time;
  if (S.mode === 'battle' && S.battle) {
    const b = S.battle;
    stepSim(b.frames.length - S.playhead < 60 ? 14 : 6);
    if (S.playing) {
      const prev = S.playhead;
      S.playhead = Math.min(lastTick(), S.playhead + dt * TPS * S.speed);
      fireEvents(prev, S.playhead);
      if (b.done && S.playhead >= lastTick()) {
        S.playing = false; setPlayIcon();
        if (!S.resultShown) { S.resultShown = true; setTimeout(() => { if (S.mode === 'battle' && S.battle === b) showResult(); }, 700); }
      }
    }
    const t = Math.floor(S.playhead);
    showFrame(b, t, S.playhead - t);
    updateHud(); updateToast(); drawScrub(); updateInspect();
  } else if (S.preview) {
    showFrame(S.preview, 0, 0);
  }
  if (cam.auto && !pointers.size) { cam.theta += dt * 0.08; updateCamera(); }
  const pulse = 1 + 0.18 * Math.sin(time * 3.2);
  cores[1].scale.setScalar(pulse); cores[2].scale.setScalar(1 + 0.18 * Math.sin(time * 3.2 + 1.3));
  updateFx(dt);
  if (renderer) renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ===================== Boot =====================
renderProgress();
S.level = Math.max(0, prog.cleared.findIndex(c => !c)); if (prog.cleared.every(Boolean)) S.level = LEVELS.length - 1;
setMode('rack'); renderRack(); previewLevel(S.level);
resize();
requestAnimationFrame(frame);
})();

</script>

</body></html>
